[project]
name = "ai-employee-platform-backend"
version = "1.1.1"
description = "AI Employee Platform — Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "PyJWT>=2.13.0",
    "cryptography>=46.0.6",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.1",
    "python-multipart>=0.0.31",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "email-validator>=2.2.0",
    "jsonschema>=4.23.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.2.0",
    "pypdf>=6.16.1",
    "python-docx>=1.1.2",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "stripe>=11.0.0",
    "openai>=2.44.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.0",
    "ruff>=0.9.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "requires_ocr: test requires the OCR runtime available in the production-like API container",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the RC8 lint baseline explicit. Ruff 0.16+ expanded its default rule
# set substantially; relying on implicit defaults would make CI fail merely
# because the unpinned minimum-compatible Ruff version changed.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E401",
    "E402",
    "E701",
    "E702",
    "E712",
    "F401",
    "F811",
    "F841",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]
