x-worker-common: &worker-common
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    DATABASE_URL: postgresql+asyncpg://aiep:aiep@postgres:5432/aiep
    DATABASE_URL_SYNC: postgresql://aiep:aiep@postgres:5432/aiep
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    APP_ENV: e2e
    DEBUG: "false"
    SECRET_KEY: "e2e-only-change-me"
    CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://172.18.0.1:3000","http://host.docker.internal:3000"]'
    RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
    AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-deterministic}
    LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
    AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-google/gemma-4-e4b}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-true}
    SMTP_ALLOWED_RECIPIENT_DOMAINS: ${SMTP_ALLOWED_RECIPIENT_DOMAINS:-[]}
    SALES_OUTREACH_PROVIDER_NAME: ${SALES_OUTREACH_PROVIDER_NAME:-none}
    SALES_PAYMENT_PROVIDER_NAME: ${SALES_PAYMENT_PROVIDER_NAME:-none}
    MARKETPLACE_PAYOUT_PROVIDER_NAME: ${MARKETPLACE_PAYOUT_PROVIDER_NAME:-none}
    SKILL_MARKETPLACE_SETTLEMENT_ENABLED: ${SKILL_MARKETPLACE_SETTLEMENT_ENABLED:-false}
    SKILL_MARKETPLACE_PLATFORM_FEE_BPS: ${SKILL_MARKETPLACE_PLATFORM_FEE_BPS:-0}
    ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
    ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
    ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL:-http://localhost:8000/api/v1/webhooks/billing/zarinpal}
    ZARINPAL_TIMEOUT_SECONDS: ${ZARINPAL_TIMEOUT_SECONDS:-15}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    STRIPE_CHECKOUT_SUCCESS_URL: ${STRIPE_CHECKOUT_SUCCESS_URL:-http://localhost:3000/billing?checkout=success}
    STRIPE_CHECKOUT_CANCEL_URL: ${STRIPE_CHECKOUT_CANCEL_URL:-http://localhost:3000/billing?checkout=cancelled}
    STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL:-http://localhost:3000/billing}
    SALES_INBOUND_PROVIDER_NAME: ${SALES_INBOUND_PROVIDER_NAME:-none}
    SALES_INBOUND_TENANT_ID: ${SALES_INBOUND_TENANT_ID:-}
    SALES_INBOUND_WEBHOOK_SECRETS: ${SALES_INBOUND_WEBHOOK_SECRETS:-{}}
    MARKET_DATA_PROVIDER_BASE_URL: ${MARKET_DATA_PROVIDER_BASE_URL:-http://e2e-market-provider:8090}
  volumes:
    - app_storage:/app/var/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    api:
      condition: service_healthy

services:
  storage-init:
    image: alpine:3.20
    user: "0:0"
    volumes:
      - app_storage:/storage
    command: ["sh", "-c", "mkdir -p /storage && chown -R 10001:10001 /storage && chmod 755 /storage"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiep
      POSTGRES_PASSWORD: aiep
      POSTGRES_DB: aiep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiep -d aiep"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  smtp-test:
    user: "0:0"
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "scripts/e2e_smtp_sink.py"]
    environment:
      APP_ENV: e2e
      DEBUG: "false"
    volumes:
      - smtp_outbox:/smtp-outbox
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',2525),2); s.close()"]
      interval: 3s
      timeout: 3s
      retries: 20

  e2e-market-provider:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "scripts/e2e_market_data_provider.py"]
    environment:
      APP_ENV: e2e
      DEBUG: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://aiep:aiep@postgres:5432/aiep
      DATABASE_URL_SYNC: postgresql://aiep:aiep@postgres:5432/aiep
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      APP_ENV: e2e
      DEBUG: "false"
      SECRET_KEY: "e2e-only-change-me"
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://172.18.0.1:3000","http://host.docker.internal:3000"]'
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-deterministic}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-google/gemma-4-e4b}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-true}
      SMTP_ALLOWED_RECIPIENT_DOMAINS: ${SMTP_ALLOWED_RECIPIENT_DOMAINS:-[]}
      SALES_OUTREACH_PROVIDER_NAME: ${SALES_OUTREACH_PROVIDER_NAME:-none}
      SALES_PAYMENT_PROVIDER_NAME: ${SALES_PAYMENT_PROVIDER_NAME:-none}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
      ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL:-http://localhost:8000/api/v1/webhooks/billing/zarinpal}
      ZARINPAL_TIMEOUT_SECONDS: ${ZARINPAL_TIMEOUT_SECONDS:-15}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CHECKOUT_SUCCESS_URL: ${STRIPE_CHECKOUT_SUCCESS_URL:-http://localhost:3000/billing?checkout=success}
      STRIPE_CHECKOUT_CANCEL_URL: ${STRIPE_CHECKOUT_CANCEL_URL:-http://localhost:3000/billing?checkout=cancelled}
      STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL:-http://localhost:3000/billing}
      SALES_INBOUND_PROVIDER_NAME: ${SALES_INBOUND_PROVIDER_NAME:-none}
      SALES_INBOUND_TENANT_ID: ${SALES_INBOUND_TENANT_ID:-}
      SALES_INBOUND_WEBHOOK_SECRETS: ${SALES_INBOUND_WEBHOOK_SECRETS:-{}}
      SALES_INBOUND_MAILBOX_HOST: ${SALES_INBOUND_MAILBOX_HOST:-}
      SALES_INBOUND_MAILBOX_PORT: ${SALES_INBOUND_MAILBOX_PORT:-993}
      SALES_INBOUND_MAILBOX_USERNAME: ${SALES_INBOUND_MAILBOX_USERNAME:-}
      SALES_INBOUND_MAILBOX_PASSWORD: ${SALES_INBOUND_MAILBOX_PASSWORD:-}
      SALES_INBOUND_MAILBOX_FOLDER: ${SALES_INBOUND_MAILBOX_FOLDER:-INBOX}
      SALES_INBOUND_MAILBOX_TIMEOUT_SECONDS: ${SALES_INBOUND_MAILBOX_TIMEOUT_SECONDS:-20}
      W10_SALES_RECIPIENT_EMAIL: ${W10_SALES_RECIPIENT_EMAIL:-}
      W10_LIVE_SMTP_CERTIFICATION: ${W10_LIVE_SMTP_CERTIFICATION:-false}
      MARKET_DATA_PROVIDER_BASE_URL: ${MARKET_DATA_PROVIDER_BASE_URL:-http://e2e-market-provider:8090}
    volumes:
      - app_storage:/app/var/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/dependencies')\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    <<: *worker-common
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2", "--queues=execution"]

  worker-test-center:
    <<: *worker-common
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2", "--queues=test_center"]

  worker-control:
    <<: *worker-common
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2", "--queues=control"]

  worker-outbox:
    <<: *worker-common
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=1", "--queues=outbox"]

  worker-email:
    <<: *worker-common
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=1", "--queues=email"]

  beat:
    <<: *worker-common
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""
        ]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

volumes:
  postgres_data:
  app_storage:
  smtp_outbox:
