schema_version: 1

# Commercial delivery identity.
# Example/template for the current v1.2.0 release line.
package_id: replace-me
edition: vendor # vendor | reseller | customer

vendor:
  product: AI-Employee
  release_tag: v1.2.0
  # Always replace this placeholder with the exact immutable commit SHA recorded by the release workflow.
  commit_sha: replace-with-exact-v1.2.0-release-sha

# Required for reseller/customer deliveries; set to null for a vendor package.
reseller:
  id: null
  delivery_revision: null

# Required for customer deliveries; set to null for vendor/reseller packages.
customer:
  id: null
  deployment_revision: null

deployment:
  environment: replace-me
  region: replace-me
  image_registry: replace-me

configuration:
  schema_version: 1
  revision: replace-me

entitlements:
  plan: replace-me
  features: []

artifacts:
  backend_image: replace-me@sha256:replace-me
  frontend_image: replace-me@sha256:replace-me
  worker_image: replace-me@sha256:replace-me

verification:
  certification_status: pass
  deployment_status: pending
  rollback_status: pending

# Never place credentials, API keys, passwords, private tokens, or customer data here.
