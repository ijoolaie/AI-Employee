name: Workforce W10 Live Stripe Checkout Certification

on:
  workflow_dispatch:

concurrency:
  group: workforce-w10-live-stripe-checkout
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-stripe-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DEBUG: "true"
      SALES_PAYMENT_PROVIDER_NAME: stripe
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      W10_STRIPE_CERTIFICATION_EMAIL: ${{ secrets.W10_STRIPE_CERTIFICATION_EMAIL }}
    steps:
      - uses: actions/checkout@v7

      - name: Build and start W10 stack
        run: |
          timeout 10m docker compose up -d --build postgres redis smtp-test e2e-market-provider storage-init api worker worker-outbox worker-email beat

      - name: Prepare stack database
        run: |
          timeout 5m docker compose exec -T api alembic upgrade head
          timeout 3m docker compose exec -T api alembic check
          test "$(docker compose exec -T api sh -lc 'alembic heads | wc -l' | tr -d '\\r')" = "1"

      - name: Wait for application health
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/dependencies >/dev/null; then
              echo "API HEALTH PASS"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200 api worker
          exit 1

      - name: Verify live Stripe configuration
        run: |
          test -n "$STRIPE_SECRET_KEY"
          docker compose exec -T api python -c 'from app.core.config import get_settings; s=get_settings(); assert s.sales_payment_provider_name == "stripe"; assert s.stripe_secret_key; print("W10 LIVE STRIPE CONFIG PASS")'

      - name: Compile live Stripe certification
        run: |
          timeout 2m docker compose exec -T api python -m py_compile scripts/e2e_workforce_w10_live_stripe_checkout_verify.py app/services/workforce_sales_payment_provider.py

      - name: Create real Stripe Checkout Session
        run: |
          timeout 8m docker compose exec -T api python scripts/e2e_workforce_w10_live_stripe_checkout_verify.py

      - name: Safety assertion
        run: |
          echo "W10 LIVE STRIPE SAFETY PASS: workflow contains checkout creation only; no payment confirmation operation is executed"

      - name: Failure diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=300 api worker || true

      - name: Shutdown
        if: always()
        run: |
          timeout 3m docker compose down -v --remove-orphans || true
