name: Workforce W2 Engineering E2E

on:
  push:
    branches: [main]
    paths:
      - "backend/scripts/e2e_workforce_w2_engineering_verify.py"
      - "backend/app/services/workforce_semantic_domains.py"
      - "backend/app/services/ai_workforce_roles.py"
      - "backend/app/ai/tool_registry.py"
      - "backend/app/services/storage.py"
      - "backend/tests/test_workforce_engineering_providers.py"
      - "backend/app/services/workforce_engineering_providers.py"
      - ".github/workflows/workforce-w2-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/scripts/e2e_workforce_w2_engineering_verify.py"
      - "backend/app/services/workforce_semantic_domains.py"
      - "backend/app/services/ai_workforce_roles.py"
      - "backend/app/ai/tool_registry.py"
      - "backend/app/services/storage.py"
      - ".github/workflows/workforce-w2-e2e.yml"

concurrency:
  group: workforce-w2-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  w2-real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiep
          POSTGRES_PASSWORD: aiep
          POSTGRES_DB: aiep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiep -d aiep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e .

      - name: Compile W2 sources
        working-directory: backend
        run: |
          python -m py_compile app/services/workforce_semantic_domains.py app/services/workforce_engineering_providers.py scripts/e2e_workforce_w2_engineering_verify.py tests/test_workforce_engineering_providers.py

      - name: Run W2 semantic certification
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://aiep:aiep@localhost:5432/aiep
          DATABASE_URL_SYNC: postgresql+psycopg2://aiep:aiep@localhost:5432/aiep
          STORAGE_DIR: ./var/storage
        run: |
          alembic upgrade head
          alembic check
          test "$(alembic heads | grep -c "(head)")" -eq 1
          pytest -q tests/test_workforce_engineering_providers.py
          python scripts/e2e_workforce_w2_engineering_verify.py
