name: Release Candidate Validation Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/releases/v1.4.0-rc.1.md'
      - '.github/workflows/release-candidate-gates.yml'
  push:
    branches: [main]
    paths:
      - 'docs/releases/**'
      - '.github/workflows/release-candidate-gates.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-required-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Dispatch and wait for required validation workflows
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_REF: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          run_gate() {
            local workflow="$1"
            local label="$2"

            echo "Dispatching ${label} (${workflow}) for ${TARGET_SHA} on ${TARGET_REF}"
            gh workflow run "${workflow}" --repo "$GITHUB_REPOSITORY" --ref "$TARGET_REF"

            local run_id=""
            for _ in $(seq 1 30); do
              run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 20 --json databaseId,headSha,status --jq ".[] | select(.headSha == \"${TARGET_SHA}\") | .databaseId" | head -n1 || true)"
              if [[ -n "$run_id" ]]; then
                break
              fi
              sleep 2
            done

            if [[ -z "$run_id" ]]; then
              echo "No ${label} workflow run appeared for ${TARGET_SHA}"
              return 1
            fi

            echo "Tracking ${label} run ${run_id}"
            for _ in $(seq 1 210); do
              status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
              conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // empty')"
              echo "${label}: status=${status} conclusion=${conclusion}"

              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]]
                return
              fi
              sleep 10
            done

            echo "${label} did not complete within the release-candidate gate timeout"
            return 1
          }

          run_gate production-infrastructure-validation.yml "Production Infrastructure Validation"
          run_gate ha-failure-recovery.yml "HA Failure Recovery Validation"
          run_gate dast-ephemeral-validation.yml "Ephemeral DAST Validation"
