name: _lease_fix
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.ref == 'fix/workflow-execution-lease-fencing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Apply
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/app/services/workflow_service.py'); s=p.read_text()
          s=s.replace('async def execute_workflow(db: AsyncSession, *, workflow_run_id: uuid.UUID) -> WorkflowRun:', 'async def execute_workflow(db: AsyncSession, *, workflow_run_id: uuid.UUID, execution_lease_id: uuid.UUID | None = None) -> WorkflowRun:')
          old='''    if run.status == "running":\n        if run.deadline_at is None or not run.execution_lease_expires_at or run.execution_lease_expires_at <= now:\n            lease_id = await acquire_workflow_execution_lease(db, workflow_run_id=run.id, allow_recovery=bool(run.deadline_at))\n        else:\n            raise ValidationAppError("WORKFLOW_EXECUTION_LEASE_LOST")\n    else:\n        lease_id = await acquire_workflow_execution_lease(db, workflow_run_id=run.id)\n'''
          new='''    if execution_lease_id is not None:\n        lease_id = execution_lease_id\n    elif run.status == "running":\n        if run.deadline_at is not None and run.execution_lease_expires_at and run.execution_lease_expires_at <= now:\n            lease_id = await acquire_workflow_execution_lease(db, workflow_run_id=run.id, allow_recovery=True)\n        else:\n            raise ValidationAppError("WORKFLOW_EXECUTION_LEASE_LOST")\n    else:\n        lease_id = await acquire_workflow_execution_lease(db, workflow_run_id=run.id)\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='''                    step.employee_run_id = child.id\n                    await run_service.execute_run(db, run_id=child.id)\n'''
          new='''                    step.employee_run_id = child.id\n                    await db.commit()\n                    await assert_workflow_execution_lease(db, workflow_run_id=run.id, lease_id=lease_id)\n                    await run_service.execute_run(db, run_id=child.id)\n'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('backend/app/workers/workflow_worker.py'); s=p.read_text()
          assert 'heartbeat_workflow_execution_lease' not in s
          s=s.replace('from app.services import workflow_service\n', 'from app.services import workflow_service\nfrom app.services.workflow_execution_lease import heartbeat_workflow_execution_lease\n')
          start=s.index('async def _run_async('); end=s.index('\n\n@celery_app.task(name="workflow.execute"', start)
          new='''async def _lease_heartbeat_loop(workflow_run_id: uuid.UUID, lease_id: uuid.UUID, lost: asyncio.Event) -> None:\n    try:\n        while True:\n            await asyncio.sleep(20)\n            async with worker_db_session() as heartbeat_db:\n                try:\n                    await heartbeat_workflow_execution_lease(heartbeat_db, workflow_run_id=workflow_run_id, lease_id=lease_id)\n                    await heartbeat_db.commit()\n                except Exception:\n                    await heartbeat_db.rollback()\n                    lost.set()\n                    return\n    except asyncio.CancelledError:\n        raise\n\n\nasync def _run_async(workflow_run_id: str, tenant_id: str) -> None:\n    started = perf_counter()\n    workflow_uuid = uuid.UUID(workflow_run_id)\n    with span("aiep.workflow.execute", workflow_run_id=workflow_run_id, tenant_id=tenant_id) as current_span:\n        async with worker_db_session() as db:\n            heartbeat_task=None; execution_task=None; lost=asyncio.Event()\n            try:\n                lease_id=await workflow_service.acquire_workflow_execution_lease(db, workflow_run_id=workflow_uuid)\n                execution_task=asyncio.create_task(workflow_service.execute_workflow(db, workflow_run_id=workflow_uuid, execution_lease_id=lease_id))\n                heartbeat_task=asyncio.create_task(_lease_heartbeat_loop(workflow_uuid, lease_id, lost))\n                done,_=await asyncio.wait({execution_task, heartbeat_task}, return_when=asyncio.FIRST_COMPLETED)\n                if heartbeat_task in done and lost.is_set() and not execution_task.done():\n                    execution_task.cancel(); await asyncio.gather(execution_task, return_exceptions=True)\n                    raise workflow_service.ValidationAppError("WORKFLOW_EXECUTION_LEASE_LOST")\n                run=await execution_task\n                if lost.is_set(): raise workflow_service.ValidationAppError("WORKFLOW_EXECUTION_LEASE_LOST")\n                if str(run.tenant_id) != str(tenant_id): raise ValueError("Worker tenant context does not match Workflow Run tenant")\n                await db.commit(); status=run.status; WORKFLOW_RUNS.labels(status).inc(); WORKFLOW_LATENCY.observe(perf_counter()-started)\n                if current_span is not None: current_span.set_attribute("workflow.status", status)\n            except Exception as exc:\n                if "WORKFLOW_EXECUTION_LEASE_LOST" in str(exc): await db.rollback()\n                else: await db.commit()\n                WORKFLOW_RUNS.labels("error").inc(); WORKFLOW_LATENCY.observe(perf_counter()-started); logger.exception("workflow_execution_failed", extra={"workflow_run_id":workflow_run_id}); raise\n            finally:\n                if heartbeat_task is not None:\n                    heartbeat_task.cancel(); await asyncio.gather(heartbeat_task, return_exceptions=True)\n'''
          s=s[:start]+new+s[end:]; p.write_text(s)
          PY
          git rm -f .github/workflows/_lease_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/workflow_service.py backend/app/workers/workflow_worker.py
          git diff --cached --check
          git commit -m 'fix: enforce workflow lease at execution boundary'
          git push