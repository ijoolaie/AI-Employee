name: Public widget browser/API acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/public-widget-browser-api.yml'

permissions:
  contents: read

jobs:
  public-widget-browser-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiep
          POSTGRES_PASSWORD: aiep
          POSTGRES_DB: aiep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiep -d aiep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aiep:aiep@localhost:5432/aiep
      DATABASE_URL_SYNC: postgresql://aiep:aiep@localhost:5432/aiep
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
      APP_ENV: test
      CI: true
      DEBUG: 'false'
      AI_DEFAULT_PROVIDER: deterministic
      STRIPE_SECRET_KEY: ''
      STRIPE_PUBLISHABLE_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      SHOPIFY_CLIENT_ID: ''
      SHOPIFY_CLIENT_SECRET: ''
      ANTHROPIC_API_KEY: ''
      LM_STUDIO_API_KEY: ''
      SMTP_PASSWORD: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Start the real FastAPI service
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/public-widget-api.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8000/docs >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/public-widget-api.log
          exit 1

      - name: Provision disposable tenant, employee, and public channel through the API
        working-directory: backend
        run: python scripts/e2e_public_widget_fixture.py

      - name: Start the real Celery execution worker
        working-directory: backend
        run: |
          nohup celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --pool=solo --queues=execution --hostname=public-widget-worker@%h >/tmp/public-widget-worker.log 2>&1 &
          for i in {1..30}; do
            if grep -q "ready." /tmp/public-widget-worker.log; then exit 0; fi
            sleep 2
          done
          cat /tmp/public-widget-worker.log
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend with the real API proxy destination
        working-directory: frontend
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ''
        run: npm run build

      - name: Start the production Next.js server
        working-directory: frontend
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
        run: |
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 >/tmp/public-widget-frontend.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/public-widget-frontend.log
          exit 1

      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify browser-to-real-API-and-worker assistant response
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test e2e/public-chat-real-api.spec.ts

      - name: Upload API, worker, and frontend logs when the job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-widget-browser-api-logs-${{ github.sha }}
          path: |
            /tmp/public-widget-api.log
            /tmp/public-widget-worker.log
            /tmp/public-widget-frontend.log
          if-no-files-found: warn
