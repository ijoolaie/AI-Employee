name: Workforce W7 SEO Growth E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/scripts/e2e_workforce_w7_seo_growth_verify.py"
      - "backend/app/services/workforce_semantic_domains.py"
      - "backend/app/services/ai_workforce_roles.py"
      - "backend/app/ai/tool_registry.py"
      - "docker-compose.yml"
      - "backend/requirements.lock"
      - ".github/workflows/workforce-w7-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/scripts/e2e_workforce_w7_seo_growth_verify.py"
      - "backend/app/services/workforce_semantic_domains.py"
      - "backend/app/services/ai_workforce_roles.py"
      - "backend/app/ai/tool_registry.py"
      - ".github/workflows/workforce-w7-e2e.yml"

concurrency:
  group: workforce-w7-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  w7-real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and start W7 stack
        timeout-minutes: 15
        run: docker compose up -d --build postgres redis e2e-market-provider storage-init api worker worker-outbox beat
      - name: Prepare stack database
        timeout-minutes: 5
        run: |
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api alembic check
          test "$(docker compose exec -T api alembic heads | grep -c "(head)")" -eq 1
      - name: Wait for application health
        timeout-minutes: 5
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/dependencies >/dev/null; then echo "API HEALTH PASS"; exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200 api worker
          exit 1
      - name: Compile W7 sources
        timeout-minutes: 2
        run: docker compose exec -T api python -m py_compile scripts/e2e_workforce_w7_seo_growth_verify.py app/services/workforce_semantic_domains.py app/services/ai_workforce_roles.py
      - name: Run W7 real-stack certification
        timeout-minutes: 8
        run: docker compose exec -T api python scripts/e2e_workforce_w7_seo_growth_verify.py
      - name: Collect failure diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=300 api worker postgres redis
      - name: Shutdown
        if: always()
        run: docker compose down -v --remove-orphans
