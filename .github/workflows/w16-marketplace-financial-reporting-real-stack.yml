name: W16 Marketplace Financial Reporting Real-Stack

on:
  pull_request:
    paths:
      - "backend/app/services/skill_marketplace_reporting_service.py"
      - "backend/app/services/skill_marketplace_payout_service.py"
      - "backend/app/models/skill_marketplace_settlement.py"
      - "backend/app/models/skill_marketplace_purchase.py"
      - "backend/app/models/skill_marketplace_payout_proposal.py"
      - "backend/app/api/v1/admin.py"
      - "backend/app/schemas/admin_marketplace.py"
      - "backend/scripts/e2e_w16_marketplace_financial_reporting_verify.py"
      - ".github/workflows/w16-marketplace-financial-reporting-real-stack.yml"
      - "docker-compose.yml"
  workflow_dispatch:

concurrency:
  group: w16-marketplace-financial-reporting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reporting:
    name: W16 marketplace financial reporting real-stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+asyncpg://aiep:aiep@localhost:5432/aiep
      DATABASE_URL_SYNC: postgresql://aiep:aiep@localhost:5432/aiep
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-w16-marketplace-reporting-secret
      APP_ENV: test
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start database and Redis
        run: docker compose up -d postgres redis

      - name: Wait for dependencies
        run: |
          set -euo pipefail
          for i in {1..40}; do
            if docker compose exec -T postgres pg_isready -U aiep -d aiep >/dev/null 2>&1 && docker compose exec -T redis redis-cli ping >/dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs postgres redis
          exit 1

      - name: Build and start API stack
        run: docker compose up -d --build api worker beat

      - name: Wait for API readiness
        run: |
          set -euo pipefail
          for i in {1..40}; do
            if curl -fsS http://localhost:8000/health/dependencies >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs api worker beat
          exit 1

      - name: Apply migrations
        run: docker compose exec -T api alembic upgrade head

      - name: Verify migration graph
        run: |
          set -euo pipefail
          docker compose exec -T api alembic check
          test "$(docker compose exec -T api alembic heads | grep -c '(head)')" -eq 1

      - name: Run W16 marketplace financial reporting gate
        run: docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_w16_marketplace_financial_reporting_verify.py'

      - name: Assert read-only boundary
        run: |
          set -euo pipefail
          ! grep -q "stripe" backend/app/services/skill_marketplace_reporting_service.py
          ! grep -q "zarinpal" backend/app/services/skill_marketplace_reporting_service.py
          ! grep -q "create_" backend/app/services/skill_marketplace_reporting_service.py

      - name: Dump logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Teardown
        if: ${{ always() }}
        run: docker compose down -v
