# PR-target workflow: validate the SLO contract against the exact PR head.
name: SLO Error Budget Contract

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slo-error-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate SLO error budget contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate SLO contract
        run: python3 scripts/validate_slo_error_budget.py

      - name: Verify no production certification claim
        run: grep -q '"production_certification_claimed": false' slo-error-budget-evidence.json

      - name: Hash evidence
        run: sha256sum slo-error-budget-evidence.json > slo-error-budget-evidence.sha256

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: slo-error-budget-engineering-evidence
          path: |
            slo-error-budget-evidence.json
            slo-error-budget-evidence.sha256
          retention-days: 14
