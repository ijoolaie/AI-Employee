name: SLO Error Budget Contract

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate SLO error budget contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate SLO contract
        run: python3 scripts/validate_slo_error_budget.py
      - name: Verify no production certification claim
        run: "grep -q '\"production_certification_claimed\": false' slo-error-budget-evidence.json"
      - name: Hash evidence
        run: sha256sum slo-error-budget-evidence.json > slo-error-budget-evidence.sha256
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: slo-error-budget-engineering-evidence
          path: |
            slo-error-budget-evidence.json
            slo-error-budget-evidence.sha256
          retention-days: 14

# Trigger validation on PR synchronize events.
