name: Workforce W17 Career Reputation E2E
# Verification trigger reconciliation: keep PR and main-path execution explicit.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/scripts/e2e_workforce_w17_career_reputation_verify.py"
      - "backend/app/api/v1/customer_dashboard.py"
      - "backend/app/schemas/customer_dashboard.py"
      - "backend/app/services/customer_dashboard_service.py"
      - "backend/app/models/employee.py"
      - "backend/app/models/run.py"
      - "backend/app/models/work_item.py"
      - "docker-compose.yml"
      - "backend/requirements.lock"
      - ".github/workflows/workforce-w17-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/scripts/e2e_workforce_w17_career_reputation_verify.py"
      - "backend/app/api/v1/customer_dashboard.py"
      - "backend/app/schemas/customer_dashboard.py"
      - "backend/app/services/customer_dashboard_service.py"
      - "backend/app/models/employee.py"
      - "backend/app/models/run.py"
      - "backend/app/models/work_item.py"
      - "docker-compose.yml"
      - "backend/requirements.lock"
      - ".github/workflows/workforce-w17-e2e.yml"

concurrency:
  group: workforce-w17-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  w17-real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build and start W17 stack
        timeout-minutes: 15
        run: |
          docker compose up -d --build postgres redis e2e-market-provider storage-init api worker worker-outbox beat

      - name: Prepare stack database
        timeout-minutes: 5
        run: |
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api alembic check
          test "$(docker compose exec -T api alembic heads | grep -c "(head)")" -eq 1

      - name: Wait for application health
        timeout-minutes: 5
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/dependencies >/dev/null; then
              echo "API HEALTH PASS"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200 api worker
          exit 1

      - name: Compile W17 sources
        timeout-minutes: 2
        run: |
          docker compose exec -T api python -m py_compile scripts/e2e_workforce_w17_career_reputation_verify.py app/api/v1/customer_dashboard.py app/services/customer_dashboard_service.py

      - name: Run W17 real-stack certification
        timeout-minutes: 8
        run: |
          docker compose exec -T api python scripts/e2e_workforce_w17_career_reputation_verify.py

      - name: Collect failure diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=300 api worker postgres redis

      - name: Shutdown
        if: always()
        run: docker compose down -v --remove-orphans
