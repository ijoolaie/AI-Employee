name: Temporary Backend Ruff Autofix

on:
  push:
    branches:
      - ci/frontend-backend-validation

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: pip install 'ruff>=0.9.2,<1.0'
      - name: Apply Ruff autofixes
        working-directory: backend
        run: ruff check app tests --fix
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No Ruff fixes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style(backend): apply Ruff autofixes"
          git push
