name: Production Certification

# This is a release-grade, production-like certification gate.
# It is intentionally NOT a default PR/main CI workflow. Fast PR validation
# belongs to the smaller contract/unit/build workflows; this workflow is
# reserved for explicit certification and release tags.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact commit SHA to certify'
        required: true
        type: string
      release_version:
        description: 'Release identity, for example v1.4.0'
        required: true
        type: string

concurrency:
  group: production-certification-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: true

jobs:
  certification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
      RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
      DATABASE_URL: postgresql+asyncpg://aiep:aiep@localhost:5432/aiep
      DATABASE_URL_SYNC: postgresql://aiep:aiep@localhost:5432/aiep
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-certification-secret
      APP_ENV: test
      CI: true
    steps:
      - name: Checkout exact certification SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Assert certification identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "Certification SHA mismatch: expected=$TARGET_SHA actual=$actual_sha"
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit SHA"
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_version must look like vMAJOR.MINOR.PATCH, optionally with a prerelease/build suffix"
            exit 1
          fi
          echo "CERTIFICATION_IDENTITY|$RELEASE_VERSION|$TARGET_SHA"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Pin certification tooling
        working-directory: backend
        run: pip install 'ruff==0.9.2'
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Backend compile
        working-directory: backend
        run: python -m compileall -q app
      - name: Backend Ruff
        working-directory: backend
        run: ruff check app tests
      - name: Start certification infrastructure
        run: docker compose up -d postgres redis
      - name: Wait for infrastructure
        run: |
          set -euo pipefail
          for i in {1..40}; do
            if docker compose exec -T postgres pg_isready -U aiep -d aiep >/dev/null 2>&1 && docker compose exec -T redis redis-cli ping >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
          docker compose logs postgres redis
          exit 1
      - name: Prepare host test database
        working-directory: backend
        run: alembic upgrade head
      - name: Verify host migration graph is current
        working-directory: backend
        run: alembic check
      - name: Verify host migration has a single head
        working-directory: backend
        run: test "$(alembic heads | grep -c '(head)')" -eq 1
      - name: Backend tests (host-safe)
        working-directory: backend
        run: pytest -q -m 'not requires_ocr'
      - name: Frontend contract tests
        working-directory: frontend
        run: npm test
      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test:unit -- --run
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Start application stack
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          set -euo pipefail
          for i in {1..40}; do
            if curl -fsS http://localhost:8000/health/dependencies; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Prepare stack database
        run: docker compose exec -T api alembic upgrade head
      - name: Verify stack migration graph is current
        run: docker compose exec -T api alembic check
      - name: Verify stack migration has a single head
        run: test "$(docker compose exec -T api alembic heads | grep -c '(head)')" -eq 1
      - name: Verify OCR runtime in production-like API container
        run: docker compose exec -T api sh -lc 'command -v tesseract && tesseract --version && tesseract --list-langs | grep -qx fas'
      - name: OCR extraction test in production-like API container
        run: docker compose exec -T api pytest -q tests/test_document_service.py -m requires_ocr
      - name: Backend dependency E2E check
        run: docker compose exec -T api python scripts/e2e_stack_verify.py
      - name: Product gates
        id: product_gates
        shell: bash
        run: |
          set +e
          failures=0
          run_gate() {
            local name="$1"; shift
            echo "========== ${name} =========="
            "$@"; local rc=$?
            if [ "$rc" -eq 0 ]; then echo "GATE_RESULT|${name}|PASS"; else echo "GATE_RESULT|${name}|FAIL|${rc}"; failures=$((failures+1)); fi
          }
          run_gate "Auth P0" docker compose exec -T api python scripts/e2e_auth_verify.py
          run_gate "Tenant Isolation + RBAC P0" docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_tenant_rbac_verify.py'
          run_gate "Conversation Tenant Isolation P0" docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_conversation_tenant_verify.py'
          run_gate "Employee -> Run -> AI -> Result" docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_employee_run_verify.py'
          run_gate "Files -> Knowledge -> Memory" docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_files_knowledge_memory_verify.py'
          run_gate "Admin / Developer API Keys" docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_admin_developer_verify.py'
          run_gate "Workflow -> Approval -> Schedule" docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_workflow_approval_schedule_verify.py'
          run_gate "Orders -> Sales -> Invoice -> Billing" docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_commerce_billing_verify.py'
          run_gate "Reports / Analytics Tenant Isolation" docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_reports_analytics_verify.py'
          run_gate "Unified WorkItem Human real-stack" docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_unified_work_item_verify.py'
          run_gate "Unified WorkItem Agent real-stack" docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_agent_work_item_verify.py'
          echo "========== PRODUCT GATE SUMMARY =========="
          echo "Failed gates: ${failures}"
          [ "$failures" -eq 0 ]
      - name: Frontend Playwright E2E
        if: ${{ success() }}
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test
      - name: Emit immutable certification evidence manifest
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > certification-evidence.json <<EOF
          {
            "schema_version": 1,
            "evidence_type": "production-certification",
            "production_deployment_claimed": false,
            "release_version": "${RELEASE_VERSION}",
            "target_sha": "${TARGET_SHA}",
            "checked_out_sha": "${actual_sha}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_ref": "${GITHUB_WORKFLOW_REF}",
            "repository": "${GITHUB_REPOSITORY}",
            "generated_at_utc": "${timestamp}",
            "product_gate_failures": 0,
            "certification_result": "PASS"
          }
          EOF
          sha256sum certification-evidence.json > certification-evidence.json.sha256
          cat certification-evidence.json
          cat certification-evidence.json.sha256
      - name: Upload immutable certification evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-certification-evidence-${{ env.RELEASE_VERSION }}-${{ env.TARGET_SHA }}
          path: |
            certification-evidence.json
            certification-evidence.json.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Dump logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color
      - name: Stop stack
        if: ${{ always() }}
        run: docker compose down -v
