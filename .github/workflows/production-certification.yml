name: Production Certification

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiep
          POSTGRES_PASSWORD: aiep
          POSTGRES_DB: aiep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiep -d aiep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://aiep:aiep@localhost:5432/aiep
      DATABASE_URL_SYNC: postgresql://aiep:aiep@localhost:5432/aiep
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-certification-secret
      APP_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install -e '.[dev]'
      - name: Pin certification tooling
        run: pip install 'ruff==0.9.2'
      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fas
      - name: Compile
        run: python -m compileall -q app
      - name: Ruff
        run: ruff check app tests
      - name: Prepare test database
        run: alembic upgrade head
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Contract tests
        run: npm test
      - name: Unit tests
        run: npm run test:unit -- --run
      - name: Production build
        run: npm run build

  stack-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright certification dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8000/health/dependencies; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Prepare stack database
        run: docker compose exec -T api alembic upgrade head
      - name: Run backend dependency E2E check
        run: docker compose exec -T api python scripts/e2e_stack_verify.py
      - name: Run Auth P0 real-stack certification
        run: docker compose exec -T api python scripts/e2e_auth_verify.py
      - name: Run Tenant Isolation + RBAC P0 real-stack certification
        run: docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_tenant_rbac_verify.py'
      - name: Run Employee -> Run -> AI -> Result Product Acceptance certification
        run: docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_employee_run_verify.py'
      - name: Run Files -> Knowledge -> Memory Product Acceptance certification
        run: docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_files_knowledge_memory_verify.py'
      - name: Run Workflow -> Approval -> Schedule Product Acceptance certification
        run: docker compose exec -T api sh -lc 'cd /app && PYTHONPATH=/app python scripts/e2e_workflow_approval_schedule_verify.py'
      - name: Run frontend Playwright E2E against running stack
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npx playwright test
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
