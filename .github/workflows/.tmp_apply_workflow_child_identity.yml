name: temporary workflow child identity patch
on:
  push:
    branches:
      - hardening/workflow-child-run-identity
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != '' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply durable child identity patch
        run: |
          python - <<'PY'
          from pathlib import Path

          run_p = Path('backend/app/models/run.py')
          s = run_p.read_text()
          s = s.replace('from sqlalchemy import DateTime, ForeignKey, Numeric, String, func', 'from sqlalchemy import DateTime, ForeignKey, Numeric, String, UniqueConstraint, func')
          needle = '    conversation_id: Mapped[uuid.UUID | None] = mapped_column(UUID(as_uuid=True), ForeignKey("customer_conversations.id", ondelete="SET NULL"), nullable=True, index=True)\n'
          repl = needle + '    workflow_step_run_id: Mapped[uuid.UUID | None] = mapped_column(UUID(as_uuid=True), ForeignKey("workflow_step_runs.id", ondelete="SET NULL"), nullable=True, index=True)\n    workflow_parallel_branch_run_id: Mapped[uuid.UUID | None] = mapped_column(UUID(as_uuid=True), ForeignKey("workflow_parallel_branch_runs.id", ondelete="SET NULL"), nullable=True, index=True)\n'
          assert needle in s and 'workflow_step_run_id' not in s
          s = s.replace(needle, repl)
          needle = '    created_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), server_default=func.now(), nullable=False, index=True)\n'
          repl = needle + '    __table_args__ = (\n        UniqueConstraint("workflow_step_run_id", name="uq_runs_workflow_step_run_id"),\n        UniqueConstraint("workflow_parallel_branch_run_id", name="uq_runs_workflow_parallel_branch_run_id"),\n    )\n'
          assert needle in s and '__table_args__' not in s
          s = s.replace(needle, repl)
          run_p.write_text(s)

          mig = Path('backend/alembic/versions/f1a2b3c4d5e6_add_workflow_child_run_identity.py')
          mig.write_text('''"""Persist durable workflow child Run ownership identity.\n\nRevision ID: f1a2b3c4d5e6\nRevises: e7f8a9b0c1d2\n"""\nfrom alembic import op\nimport sqlalchemy as sa\n\nrevision = "f1a2b3c4d5e6"\ndown_revision = "e7f8a9b0c1d2"\nbranch_labels = None\ndepends_on = None\n\n\ndef upgrade() -> None:\n    op.add_column("runs", sa.Column("workflow_step_run_id", sa.UUID(), nullable=True))\n    op.add_column("runs", sa.Column("workflow_parallel_branch_run_id", sa.UUID(), nullable=True))\n    op.create_foreign_key("fk_runs_workflow_step_run_id", "runs", "workflow_step_runs", ["workflow_step_run_id"], ["id"], ondelete="SET NULL")\n    op.create_foreign_key("fk_runs_workflow_parallel_branch_run_id", "runs", "workflow_parallel_branch_runs", ["workflow_parallel_branch_run_id"], ["id"], ondelete="SET NULL")\n    op.create_index("ix_runs_workflow_step_run_id", "runs", ["workflow_step_run_id"])\n    op.create_index("ix_runs_workflow_parallel_branch_run_id", "runs", ["workflow_parallel_branch_run_id"])\n    op.create_unique_constraint("uq_runs_workflow_step_run_id", "runs", ["workflow_step_run_id"])\n    op.create_unique_constraint("uq_runs_workflow_parallel_branch_run_id", "runs", ["workflow_parallel_branch_run_id"])\n\n\ndef downgrade() -> None:\n    op.drop_constraint("uq_runs_workflow_parallel_branch_run_id", "runs", type_="unique")\n    op.drop_constraint("uq_runs_workflow_step_run_id", "runs", type_="unique")\n    op.drop_index("ix_runs_workflow_parallel_branch_run_id", table_name="runs")\n    op.drop_index("ix_runs_workflow_step_run_id", table_name="runs")\n    op.drop_constraint("fk_runs_workflow_parallel_branch_run_id", "runs", type_="foreignkey")\n    op.drop_constraint("fk_runs_workflow_step_run_id", "runs", type_="foreignkey")\n    op.drop_column("runs", "workflow_parallel_branch_run_id")\n    op.drop_column("runs", "workflow_step_run_id")\n''')

          wf = Path('backend/app/services/workflow_service.py')
          s = wf.read_text()
          old = '''                else:\n                    child = await run_service.create_run(db, tenant_id=parent.tenant_id, employee_id=uuid.UUID(str(definition["employee_id"])), employee_version_id=uuid.UUID(str(definition["employee_version_id"])) if definition.get("employee_version_id") else None, input_data=step_input, created_by=parent.created_by)\n                    branch.employee_run_id = child.id\n                    await db.commit()\n                    await assert_parallel_branch_execution_lease(db, branch_id=branch.id, lease_id=lease_id)\n                    if heartbeat_lost.is_set():\n                        raise ValidationAppError("WORKFLOW_BRANCH_EXECUTION_LEASE_LOST")\n                    await run_service.execute_run(db, run_id=child.id)\n'''
          new = '''                else:\n                    child = await run_service.create_run(db, tenant_id=parent.tenant_id, employee_id=uuid.UUID(str(definition["employee_id"])), employee_version_id=uuid.UUID(str(definition["employee_version_id"])) if definition.get("employee_version_id") else None, input_data=step_input, created_by=parent.created_by)\n                    child.workflow_parallel_branch_run_id = branch.id\n                    branch.employee_run_id = child.id\n                    await db.flush()\n                    await db.commit()\n                    await assert_parallel_branch_execution_lease(db, branch_id=branch.id, lease_id=lease_id)\n                    if heartbeat_lost.is_set():\n                        raise ValidationAppError("WORKFLOW_BRANCH_EXECUTION_LEASE_LOST")\n                    await run_service.execute_run(db, run_id=child.id)\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            if child is None:\n                try:\n                    child = await run_service.create_run(db, tenant_id=run.tenant_id, employee_id=uuid.UUID(str(definition["employee_id"])), employee_version_id=uuid.UUID(str(definition["employee_version_id"])) if definition.get("employee_version_id") else None, input_data=step_input, created_by=run.created_by)\n                    step.employee_run_id = child.id\n                    await db.commit()\n                    await assert_workflow_execution_lease(db, workflow_run_id=run.id, lease_id=lease_id)\n                    await run_service.execute_run(db, run_id=child.id)\n'''
          new = '''            if child is None:\n                durable_result = await db.execute(select(Run).where(Run.workflow_step_run_id == step.id))\n                durable_child = durable_result.scalar_one_or_none()\n                if durable_child is not None:\n                    if durable_child.status == "success":\n                        step.employee_run_id = durable_child.id\n                        child = durable_child\n                    else:\n                        step.status = "failed"\n                        step.error = {"code": "WORKFLOW_CHILD_RETRY_UNSAFE", "message": f"Durable child Run ended with status {durable_child.status}; refusing replacement."}\n                        step.completed_at = datetime.now(timezone.utc)\n                        raise ValidationAppError(step.error["message"])\n            if child is None:\n                try:\n                    child = await run_service.create_run(db, tenant_id=run.tenant_id, employee_id=uuid.UUID(str(definition["employee_id"])), employee_version_id=uuid.UUID(str(definition["employee_version_id"])) if definition.get("employee_version_id") else None, input_data=step_input, created_by=run.created_by)\n                    child.workflow_step_run_id = step.id\n                    step.employee_run_id = child.id\n                    await db.flush()\n                    await db.commit()\n                    await assert_workflow_execution_lease(db, workflow_run_id=run.id, lease_id=lease_id)\n                    await run_service.execute_run(db, run_id=child.id)\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''                if existing_child is None:\n                    step.status = "failed"\n                    step.error = {"code": "WORKFLOW_CHILD_RETRY_UNSAFE", "message": "Linked employee Run is missing; refusing to create a replacement Run."}\n                    step.completed_at = datetime.now(timezone.utc)\n                    raise ValidationAppError(step.error["message"])\n'''
          new = '''                if existing_child is None:\n                    step.status = "failed"\n                    step.error = {"code": "WORKFLOW_CHILD_RETRY_UNSAFE", "message": "Linked employee Run is missing; refusing to create a replacement Run."}\n                    step.completed_at = datetime.now(timezone.utc)\n                    raise ValidationAppError(step.error["message"])\n                if existing_child.workflow_step_run_id != step.id:\n                    step.status = "failed"\n                    step.error = {"code": "WORKFLOW_CHILD_RETRY_UNSAFE", "message": "Linked employee Run has no matching durable workflow-step identity; refusing replay."}\n                    step.completed_at = datetime.now(timezone.utc)\n                    raise ValidationAppError(step.error["message"])\n'''
          assert old in s
          s = s.replace(old, new, 1)
          wf.write_text(s)

          test_p = Path('backend/tests/test_workflow_child_run_identity.py')
          test_p.write_text('''from pathlib import Path\n\nROOT = Path(__file__).parents[1]\nRUN_MODEL = ROOT / "app/models/run.py"\nMIGRATION = ROOT / "alembic/versions/f1a2b3c4d5e6_add_workflow_child_run_identity.py"\nWORKFLOW = ROOT / "app/services/workflow_service.py"\n\ndef test_run_has_durable_workflow_child_identity():\n    source = RUN_MODEL.read_text()\n    assert "workflow_step_run_id" in source\n    assert "workflow_parallel_branch_run_id" in source\n\ndef test_migration_persists_durable_child_identity():\n    source = MIGRATION.read_text()\n    assert "workflow_step_run_id" in source\n    assert "workflow_parallel_branch_run_id" in source\n\ndef test_workflow_links_child_before_execution_commit():\n    source = WORKFLOW.read_text()\n    assert "child.workflow_step_run_id = step.id" in source\n    assert "child.workflow_parallel_branch_run_id = branch.id" in source\n\ndef test_workflow_resolves_durable_child_before_replacement():\n    source = WORKFLOW.read_text()\n    assert "select(Run).where(Run.workflow_step_run_id == step.id)" in source\n    assert "Durable child Run ended with status" in source\n''')

          Path('.github/workflows/.tmp_apply_workflow_child_identity.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(workflow): persist durable child Run identity [skip ci]'
          git push
