name: W16 Marketplace Payout Execution Real-Stack

on:
  pull_request:
    paths:
      - "backend/app/api/v1/admin.py"
      - "backend/app/core/config.py"
      - "backend/app/models/skill_marketplace_payout_proposal.py"
      - "backend/app/models/skill_marketplace_payout_approval.py"
      - "backend/app/models/skill_marketplace_settlement.py"
      - "backend/app/services/skill_marketplace_payout_provider.py"
      - "backend/app/services/skill_marketplace_payout_service.py"
      - "backend/app/schemas/admin_marketplace.py"
      - "backend/app/services/auth_service.py"
      - "backend/alembic/versions/w16_skill_marketplace_payout_execution.py"
      - "backend/scripts/e2e_w16_marketplace_payout_execution_verify.py"
      - "backend/tests/test_skill_marketplace_payout_provider.py"
      - "backend/tests/test_skill_marketplace_payout_approval.py"
      - ".github/workflows/w16-marketplace-payout-execution-real-stack.yml"
      - "docker-compose.yml"
  workflow_dispatch:

concurrency:
  group: w16-marketplace-payout-execution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  w16-marketplace-payout-execution:
    name: W16 marketplace payout execution real-stack
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start database and Redis
        run: docker compose up -d postgres redis

      - name: Wait for dependencies
        run: |
          set -euo pipefail
          for i in {1..40}; do
            if docker compose exec -T postgres pg_isready -U aiep -d aiep >/dev/null 2>&1 && docker compose exec -T redis redis-cli ping >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
          docker compose logs postgres redis
          exit 1

      - name: Build and start API stack
        run: |
          set -euo pipefail
          printf "%s\n" "services:" "  api:" "    environment:" "      SKILL_MARKETPLACE_PAYOUT_PROVIDER_NAME: contract-test" "      SKILL_MARKETPLACE_PAYOUT_PROVIDER_TIMEOUT_SECONDS: \"10\"" > /tmp/w16-payout.override.yml
          docker compose -f docker-compose.yml -f /tmp/w16-payout.override.yml up -d --build api worker beat

      - name: Wait for API readiness
        run: |
          set -euo pipefail
          for i in {1..40}; do
            if curl -fsS http://localhost:8000/health/dependencies >/dev/null; then exit 0; fi
            sleep 3
          done
          docker compose logs api worker beat
          exit 1

      - name: Apply migrations
        run: docker compose exec -T api alembic upgrade head

      - name: Verify migration graph
        run: |
          set -euo pipefail
          docker compose exec -T api alembic check
          test "$(docker compose exec -T api alembic heads | grep -c "(head)")" -eq 1

      - name: Run W16 payout execution real-stack gate
        run: docker compose exec -T api sh -lc "cd /app && PYTHONPATH=/app python scripts/e2e_w16_marketplace_payout_execution_verify.py"

      - name: Run focused payout provider contracts
        run: docker compose exec -T api sh -lc "cd /app && PYTHONPATH=/app pytest -q tests/test_skill_marketplace_payout_provider.py tests/test_skill_marketplace_payout_approval.py"

      - name: Assert production boundary
        run: |
          set -euo pipefail
          ! grep -q "production_certification_claimed.*true" backend/scripts/e2e_w16_marketplace_payout_execution_verify.py

      - name: Dump logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Teardown
        if: ${{ always() }}
        run: docker compose down -v
