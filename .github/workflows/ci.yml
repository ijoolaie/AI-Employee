name: CI

on:
  pull_request:
    branches: [main, phase8/workitem-execution-foundation]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'docs/releases/**'
      - '.github/workflows/ci.yml'
      - 'docker-compose*.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'docs/releases/**'
      - '.github/workflows/ci.yml'
      - 'docker-compose*.yml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiep
          POSTGRES_PASSWORD: aiep
          POSTGRES_DB: aiep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiep -d aiep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aiep:aiep@localhost:5432/aiep
      DATABASE_URL_SYNC: postgresql://aiep:aiep@localhost:5432/aiep
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-only-secret
      APP_ENV: test
      CI: true
      STRIPE_SECRET_KEY: ''
      STRIPE_PUBLISHABLE_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      SHOPIFY_CLIENT_ID: ''
      SHOPIFY_CLIENT_SECRET: ''
      ANTHROPIC_API_KEY: ''
      LM_STUDIO_API_KEY: ''
      SMTP_PASSWORD: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend from direct dependency lock
        working-directory: backend
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app
      - name: Ruff
        working-directory: backend
        run: ruff check app tests
      - name: Diagnose Alembic heads
        working-directory: backend
        run: |
          echo '=== ALEMBIC HEADS ==='
          alembic heads --verbose
          echo '=== ALEMBIC CURRENT ==='
          alembic current
      - name: Validate Alembic graph traversal
        working-directory: backend
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          cfg = Config('alembic.ini')
          script = ScriptDirectory.from_config(cfg)
          heads = tuple(script.get_heads())
          print(f'=== ALEMBIC GRAPH PREFLIGHT ===')
          print(f'heads={heads}')
          revisions = list(script.walk_revisions(base='base', head='heads'))
          print(f'walk_revisions_count={len(revisions)}')
          print('walk_revisions completed successfully')

          if len(heads) != 1:
              raise SystemExit(f'Expected exactly one effective head, found {heads}')

          path = list(script.iterate_revisions(heads[0], 'base', inclusive=True))
          print(f'head_to_base_path_count={len(path)}')
          print(f'head={heads[0]}')
          print(f'base={path[-1].revision if path else None}')
          PY
      - name: Alembic upgrade
        working-directory: backend
        env:
          PGOPTIONS: '-c lock_timeout=30s -c statement_timeout=5min'
        run: |
          set -uo pipefail
          rm -f /tmp/alembic-upgrade.log
          echo '=== ALEMBIC UPGRADE DIAGNOSTIC ==='
          echo 'Starting migration with lock_timeout=30s, statement_timeout=5min'
          alembic upgrade head > /tmp/alembic-upgrade.log 2>&1 &
          alembic_pid=$!
          started=$(date +%s)

          while kill -0 "$alembic_pid" 2>/dev/null; do
            elapsed=$(( $(date +%s) - started ))
            echo "=== PostgreSQL activity (${elapsed}s) ==="
            PGPASSWORD=aiep psql "postgresql://aiep:aiep@localhost:5432/aiep" -X -A -F ' | ' -t -c "SELECT pid, state, COALESCE(wait_event_type,''), COALESCE(wait_event,''), COALESCE(backend_xid::text,''), LEFT(REPLACE(query, E'\\n', ' '), 240) FROM pg_stat_activity WHERE datname = current_database() AND pid <> pg_backend_pid() ORDER BY pid;" || true
            echo '=== Alembic output ==='
            tail -n 80 /tmp/alembic-upgrade.log || true
            if [ "$elapsed" -ge 360 ]; then
              echo 'ERROR: Alembic upgrade exceeded 6 minutes; terminating for diagnosis.'
              kill "$alembic_pid" 2>/dev/null || true
              sleep 2
              kill -9 "$alembic_pid" 2>/dev/null || true
              wait "$alembic_pid" || true
              exit 124
            fi
            sleep 10
          done

          wait "$alembic_pid"
          status=$?
          echo '=== Final Alembic output ==='
          cat /tmp/alembic-upgrade.log || true
          exit "$status"
      - name: Alembic consistency
        working-directory: backend
        run: |
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic check
      - name: Backend tests
        working-directory: backend
        run: pytest -q -m 'not requires_ocr'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Contract tests
        working-directory: frontend
        run: npm test
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit -- --run
      - name: Production build
        working-directory: frontend
        run: npm run build
