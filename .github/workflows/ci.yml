name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Do not cancel an in-flight validation run for the same ref. A cancelled
# validation run provides no evidence about the commit being certified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiep
          POSTGRES_PASSWORD: aiep
          POSTGRES_DB: aiep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiep -d aiep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aiep:aiep@localhost:5432/aiep
      DATABASE_URL_SYNC: postgresql://aiep:aiep@localhost:5432/aiep
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SECRET_KEY: ci-only-secret
      APP_ENV: test
      CI: true
      # Paid/external providers are intentionally absent in CI. Tests must use
      # in-memory adapters, mocks, or contract tests and never require billing.
      STRIPE_SECRET_KEY: ''
      STRIPE_PUBLISHABLE_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      SHOPIFY_CLIENT_ID: ''
      SHOPIFY_CLIENT_SECRET: ''
      ANTHROPIC_API_KEY: ''
      LM_STUDIO_API_KEY: ''
      SMTP_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app
      - name: Ruff
        working-directory: backend
        run: ruff check app tests
      - name: Diagnose Alembic heads
        working-directory: backend
        run: |
          echo '=== ALEMBIC HEADS ==='
          alembic heads --verbose
          echo '=== ALEMBIC CURRENT ==='
          alembic current
      - name: Alembic upgrade
        working-directory: backend
        run: alembic upgrade head
      - name: Alembic consistency
        working-directory: backend
        run: |
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic check
      - name: Backend tests
        working-directory: backend
        run: pytest -q -m 'not requires_ocr'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Frontend CI also remains independent of paid vendor accounts.
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Contract tests
        working-directory: frontend
        run: npm test
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit -- --run
      - name: Production build
        working-directory: frontend
        run: npm run build
