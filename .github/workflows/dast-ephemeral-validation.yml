name: Ephemeral DAST Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.production.yml'
      - 'docker-compose.local-production.yml'
      - 'scripts/dast_ephemeral_validation.sh'
      - '.github/workflows/dast-ephemeral-validation.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.production.yml'
      - 'docker-compose.local-production.yml'
      - 'scripts/dast_ephemeral_validation.sh'
      - '.github/workflows/dast-ephemeral-validation.yml'
  workflow_dispatch:

concurrency:
  group: dast-ephemeral-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POSTGRES_USER: dast_ci
      POSTGRES_PASSWORD: ci-only-postgres-password
      POSTGRES_DB: ai_employee_dast
      REDIS_PASSWORD: ci-only-redis-password
      SECRET_KEY: ci-only-secret-key-012345678901234567890123456789
      DATABASE_URL: postgresql+asyncpg://dast_ci:ci-only-postgres-password@postgres:5432/ai_employee_dast
      DATABASE_URL_SYNC: postgresql://dast_ci:ci-only-postgres-password@postgres:5432/ai_employee_dast
      REDIS_URL: redis://:ci-only-redis-password@redis:6379/0
      CELERY_BROKER_URL: redis://:ci-only-redis-password@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:ci-only-redis-password@redis:6379/2
      CORS_ORIGINS: '["http://127.0.0.1:13000"]'
      FRONTEND_BASE_URL: http://127.0.0.1:13000
      FRONTEND_APP_URL: http://127.0.0.1:13000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:18000/api/v1
      LM_STUDIO_BASE_URL: https://ai.example.test/v1
      SMTP_ALLOWED_RECIPIENT_DOMAINS: '[]'
      STRIPE_PRICE_MAP: '{}'
      APP_ENV: production
      DEBUG: 'false'
      RATE_LIMIT_ENABLED: 'true'
      RATE_LIMIT_FAIL_CLOSED: 'true'
      COMPOSE_PROJECT_NAME: ai-employee-dast
      ENV_FILE: .env.production
      DAST_TARGET_URL: http://host.docker.internal:18000/
      DAST_REPORT_DIR: artifacts/dast
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create ephemeral production validation environment
        run: |
          cat > .env.production <<'EOF'
          POSTGRES_USER=dast_ci
          POSTGRES_PASSWORD=ci-only-postgres-password
          POSTGRES_DB=ai_employee_dast
          SECRET_KEY=ci-only-secret-key-012345678901234567890123456789
          DATABASE_URL=postgresql+asyncpg://dast_ci:ci-only-postgres-password@postgres:5432/ai_employee_dast
          DATABASE_URL_SYNC=postgresql://dast_ci:ci-only-postgres-password@postgres:5432/ai_employee_dast
          REDIS_PASSWORD=ci-only-redis-password
          REDIS_URL=redis://:ci-only-redis-password@redis:6379/0
          CELERY_BROKER_URL=redis://:ci-only-redis-password@redis:6379/1
          CELERY_RESULT_BACKEND=redis://:ci-only-redis-password@redis:6379/2
          CORS_ORIGINS=["http://127.0.0.1:13000"]
          FRONTEND_BASE_URL=http://127.0.0.1:13000
          FRONTEND_APP_URL=http://127.0.0.1:13000
          NEXT_PUBLIC_API_URL=http://127.0.0.1:18000/api/v1
          LM_STUDIO_BASE_URL=https://ai.example.test/v1
          SMTP_ALLOWED_RECIPIENT_DOMAINS=[]
          STRIPE_PRICE_MAP={}
          EOF

      - name: Validate production compose contract
        run: docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml config --quiet

      - name: Build production application images
        run: docker compose --parallel=4 --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" build api worker beat frontend

      - name: Start infrastructure dependencies
        run: docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" up -d postgres redis storage-init

      - name: Wait for infrastructure readiness
        run: |
          for _ in $(seq 1 30); do
            pg_ready=$(docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1 && echo yes || echo no)
            redis_ready=$(docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" exec -T redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG && echo yes || echo no)
            if [[ "$pg_ready" == yes && "$redis_ready" == yes ]]; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Run database migrations
        run: docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" run --rm --no-deps api alembic upgrade head

      - name: Start API Worker Beat and Frontend
        run: docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" up -d api worker beat frontend

      - name: Wait for API target
        run: |
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" logs --no-color --tail=200 api
          exit 1

      - name: Run OWASP ZAP baseline scan
        run: bash scripts/dast_ephemeral_validation.sh

      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-ephemeral-${{ github.sha }}
          path: artifacts/dast/
          if-no-files-found: warn
          retention-days: 14

      - name: Capture service logs on failure
        if: failure()
        run: docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" logs --no-color --tail=200 api worker beat frontend postgres redis || true

      - name: Tear down ephemeral stack
        if: always()
        run: docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" down --volumes --remove-orphans
