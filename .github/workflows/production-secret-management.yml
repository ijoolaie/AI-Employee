name: Production Secret Management

on:
  pull_request:
    paths:
      - 'docker-compose.production.yml'
      - 'backend/app/core/config.py'
      - 'scripts/validate_production_secret_management.py'
      - '.github/workflows/production-secret-management.yml'
      - 'ops/production/**'
      - 'config/templates/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-management-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate secret-management contract
        run: python scripts/validate_production_secret_management.py

      - name: Enforce non-production evidence boundary
        run: |
          python scripts/validate_production_secret_management.py > secret-management-contract.txt
          grep -q 'secret_values_read=false' secret-management-contract.txt
          grep -q 'production_certification_claimed=false' secret-management-contract.txt

      - name: Hash evidence contract
        run: sha256sum secret-management-contract.txt
