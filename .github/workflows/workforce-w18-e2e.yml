name: Workforce W18 Virtual Meeting Rooms E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/models/meeting.py"
      - "backend/app/models/__init__.py"
      - "backend/app/services/meeting_service.py"
      - "backend/app/api/v1/customer_dashboard.py"
      - "backend/app/schemas/customer_dashboard.py"
      - "backend/alembic/versions/w18_virtual_meeting_rooms.py"
      - "backend/scripts/e2e_workforce_w18_meeting_rooms_verify.py"
      - "backend/tests/api/test_customer_dashboard_meeting.py"
      - "docker-compose.yml"
      - "backend/requirements.lock"
      - ".github/workflows/workforce-w18-e2e.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/models/meeting.py"
      - "backend/app/models/__init__.py"
      - "backend/app/services/meeting_service.py"
      - "backend/app/api/v1/customer_dashboard.py"
      - "backend/app/schemas/customer_dashboard.py"
      - "backend/alembic/versions/w18_virtual_meeting_rooms.py"
      - "backend/scripts/e2e_workforce_w18_meeting_rooms_verify.py"
      - "backend/tests/api/test_customer_dashboard_meeting.py"
      - ".github/workflows/workforce-w18-e2e.yml"

concurrency:
  group: workforce-w18-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  w18-real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and start W18 stack
        timeout-minutes: 15
        run: docker compose up -d --build postgres redis e2e-market-provider storage-init api worker worker-outbox beat
      - name: Prepare stack database
        timeout-minutes: 5
        run: |
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api alembic check
          test "$(docker compose exec -T api alembic heads | grep -c "(head)")" -eq 1
      - name: Wait for application health
        timeout-minutes: 5
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/dependencies >/dev/null; then echo "API HEALTH PASS"; exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200 api worker
          exit 1
      - name: Compile W18 sources
        run: docker compose exec -T api python -m py_compile scripts/e2e_workforce_w18_meeting_rooms_verify.py app/models/meeting.py app/services/meeting_service.py app/api/v1/customer_dashboard.py
      - name: Run W18 real-stack evidence
        timeout-minutes: 8
        run: docker compose exec -T api python scripts/e2e_workforce_w18_meeting_rooms_verify.py
      - name: Run W18 focused tests
        timeout-minutes: 5
        run: docker compose exec -T api pytest -q tests/api/test_customer_dashboard_meeting.py
      - name: Collect failure diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --tail=300 api worker postgres redis
      - name: Shutdown
        if: always()
        run: docker compose down -v --remove-orphans
