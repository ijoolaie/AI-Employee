name: tmp-apply-workflow-timeout-fence
on:
  push:
    branches:
      - fix/workflow-timeout-post-child-fence
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/workflow_service.py')
          text = path.read_text()

          old = '''            if fresh_status == "cancelled": run.status = "cancelled"; return run\n            if fresh_deadline and fresh_deadline <= datetime.now(timezone.utc):'''
          new = '''            if fresh_status != "running":\n                return run\n            if fresh_deadline and fresh_deadline <= datetime.now(timezone.utc):'''
          if old not in text:
              raise SystemExit('sequential workflow status fence pattern not found')
          text = text.replace(old, new, 1)

          old = '''            for definition in branch.config.get("steps", []):\n                if definition.get("type", "employee") != "employee":'''
          new = '''            for definition in branch.config.get("steps", []):\n                parent_state = await db.execute(select(WorkflowRun.status, WorkflowRun.deadline_at).where(WorkflowRun.id == parent.id))\n                parent_status, parent_deadline = parent_state.one()\n                if parent_status != "running":\n                    return\n                if parent_deadline and parent_deadline <= datetime.now(timezone.utc):\n                    return\n                if definition.get("type", "employee") != "employee":'''
          if old not in text:
              raise SystemExit('parallel branch fence pattern not found')
          text = text.replace(old, new, 1)

          path.write_text(text)

          test_path = Path('backend/tests/test_v032_timeout_cancellation.py')
          test = test_path.read_text()
          test += '''\n\ndef test_workflow_execution_fences_non_running_parent_after_child_commit():\n    source = __import__("pathlib").Path("backend/app/services/workflow_service.py").read_text()\n    assert 'if fresh_status != "running":' in source\n    assert 'if fresh_deadline and fresh_deadline <= datetime.now(timezone.utc):' in source\n\n\ndef test_parallel_branch_rechecks_parent_before_each_child():\n    source = __import__("pathlib").Path("backend/app/services/workflow_service.py").read_text()\n    assert 'parent_state = await db.execute(select(WorkflowRun.status, WorkflowRun.deadline_at)' in source\n    assert 'if parent_status != "running":' in source\n'''
          test_path.write_text(test)

          audit = Path('docs/current/WORKFLOW_EXECUTION_HARDENING_AUDIT_2026-09-11.md')
          audit.write_text('''# Workflow Execution Hardening Audit — 2026-09-11\n\n## Scope\nAudit of stale `running` workflow execution after PR #477, focused on timeout/cancellation races across independent child `Run` commits.\n\n## Finding P1 — post-child terminal-state bypass\n`execute_workflow()` re-checks the parent before each step, but previously treated only `cancelled` as a stop condition. `RunService.execute_run()` can commit a child Run independently, releasing the parent row lock. The timeout sweep can then durably mark the parent `timed_out`; the stale workflow worker would observe that status and still enter the next step.\n\nThe same boundary existed in `_execute_parallel_branch()`: after a child Run commit, the branch worker did not re-check the parent before starting the next branch child.\n\n## Fix\n- Sequential workflow execution now proceeds past the per-step fence only while the parent status is exactly `running`.\n- Parallel branch execution re-checks parent status and deadline before every child definition.\n- Terminal `timed_out`, `cancelled`, `failed`, or `success` states therefore fail closed without starting another child execution.\n- `running` remains non-retryable; this patch does not introduce blind stale-run replay.\n\n## Remaining follow-up\nA separate lease/recovery design is still required for workflows with no configured `max_runtime_seconds`, and for safe recovery of genuinely crashed `running` workers. Automatic replay must remain blocked until a durable execution lease/fence exists.\n\n## Evidence\n- Base main before this patch: `4cbcc933ab64e5ab88ce98bdf83013a24892c5d3`\n- Tracking issue: #478\n''')
          PY
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/workflow_service.py backend/tests/test_v032_timeout_cancellation.py docs/current/WORKFLOW_EXECUTION_HARDENING_AUDIT_2026-09-11.md .github/workflows/_tmp_apply_workflow_timeout_fence.yml
          git rm .github/workflows/_tmp_apply_workflow_timeout_fence.yml
          git commit -m "P1: fence workflow after parent timeout"
          git push
