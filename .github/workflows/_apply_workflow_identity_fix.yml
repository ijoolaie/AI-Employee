name: Apply workflow child identity follow-up

on:
  push:
    branches:
      - hardening/workflow-child-run-identity-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/workflow-child-run-identity-v2
          fetch-depth: 0
      - name: Patch workflow service
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/services/workflow_service.py')
          s = p.read_text()
          old = '''                else:\n                    child = await run_service.create_run(db, tenant_id=parent.tenant_id, employee_id=uuid.UUID(str(definition["employee_id"])), employee_version_id=uuid.UUID(str(definition["employee_version_id"])) if definition.get("employee_version_id") else None, input_data=step_input, created_by=parent.created_by)\n                    child.workflow_parallel_branch_run_id = branch.id\n                    branch.employee_run_id = child.id\n'''
          new = '''                else:\n                    durable_result = await db.execute(\n                        select(Run).where(\n                            Run.workflow_parallel_branch_run_id == branch.id,\n                            Run.workflow_parallel_branch_step_key == str(definition["key"]),\n                        )\n                    )\n                    durable_child = durable_result.scalar_one_or_none()\n                    if durable_child is not None:\n                        if durable_child.status != "success":\n                            raise ValidationAppError(\n                                f"WORKFLOW_CHILD_RETRY_UNSAFE: durable parallel branch Run ended with status {durable_child.status}"\n                            )\n                        child = durable_child\n                        branch.employee_run_id = durable_child.id\n                    else:\n                        child = await run_service.create_run(db, tenant_id=parent.tenant_id, employee_id=uuid.UUID(str(definition["employee_id"])), employee_version_id=uuid.UUID(str(definition["employee_version_id"])) if definition.get("employee_version_id") else None, input_data=step_input, created_by=parent.created_by)\n                        child.workflow_parallel_branch_run_id = branch.id\n                        child.workflow_parallel_branch_step_key = str(definition["key"])\n                        branch.employee_run_id = child.id\n'''
          if old not in s:
              raise SystemExit('parallel child creation block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/_apply_workflow_identity_fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/services/workflow_service.py .github/workflows/_apply_workflow_identity_fix.yml
          git commit -m "fix(workflow): scope parallel child identity to branch step"
          git push origin hardening/workflow-child-run-identity-v2
