name: Workforce W10 Live SMTP Certification

on:
  workflow_dispatch:

concurrency:
  group: workforce-w10-live-smtp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-smtp-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: development
      SALES_OUTREACH_PROVIDER_NAME: smtp
      SMTP_HOST: ${{ secrets.W10_LIVE_SMTP_HOST }}
      SMTP_PORT: ${{ secrets.W10_LIVE_SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.W10_LIVE_SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.W10_LIVE_SMTP_PASSWORD }}
      SMTP_FROM_EMAIL: ${{ secrets.W10_LIVE_SMTP_FROM_EMAIL }}
      SMTP_USE_STARTTLS: ${{ secrets.W10_LIVE_SMTP_USE_STARTTLS }}
      SMTP_ALLOWED_RECIPIENT_DOMAINS: '["${{ secrets.W10_LIVE_SMTP_ALLOWED_DOMAIN }}"]'
      W10_SALES_RECIPIENT_EMAIL: ${{ secrets.W10_LIVE_SMTP_RECIPIENT }}
      W10_LIVE_SMTP_CERTIFICATION: "true"
      W10_LIVE_MAILBOX_POLL_ATTEMPTS: "12"
      W10_LIVE_MAILBOX_POLL_INTERVAL_SECONDS: "10"
      SALES_INBOUND_PROVIDER_NAME: imap-mailbox
      SALES_INBOUND_MAILBOX_HOST: imap.gmail.com
      SALES_INBOUND_MAILBOX_PORT: "993"
      SALES_INBOUND_MAILBOX_USERNAME: ${{ secrets.W10_LIVE_SMTP_USERNAME }}
      SALES_INBOUND_MAILBOX_PASSWORD: ${{ secrets.W10_LIVE_SMTP_PASSWORD }}
      SALES_INBOUND_MAILBOX_FOLDER: INBOX
      SALES_INBOUND_MAILBOX_TIMEOUT_SECONDS: "20"
    steps:
      - uses: actions/checkout@v7

      - name: Validate live SMTP configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SMTP_HOST SMTP_PORT SMTP_FROM_EMAIL W10_SALES_RECIPIENT_EMAIL SMTP_ALLOWED_RECIPIENT_DOMAINS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required live SMTP configuration: $name"
              exit 1
            fi
          done
          python - <<'PY'
          import json, os
          recipient = os.environ["W10_SALES_RECIPIENT_EMAIL"]
          allowed = json.loads(os.environ["SMTP_ALLOWED_RECIPIENT_DOMAINS"])
          if "@" not in recipient:
              raise SystemExit("Live SMTP recipient is invalid")
          domain = recipient.rsplit("@", 1)[1].lower()
          if domain not in {str(x).strip().lower().lstrip("@") for x in allowed}:
              raise SystemExit("Live SMTP recipient domain is not in the configured allowlist")

          starttls_raw = os.environ.get("SMTP_USE_STARTTLS", "").strip().lower()
          starttls_map = {
              "true": "true",
              "false": "false",
              "1": "true",
              "0": "false",
              "yes": "true",
              "no": "false",
              "on": "true",
              "off": "false",
          }
          try:
              starttls = starttls_map[starttls_raw]
          except KeyError:
              raise SystemExit(
                  "SMTP_USE_STARTTLS must be one of: true, false, 1, 0, yes, no, on, off"
              )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"SMTP_USE_STARTTLS={starttls}\n")
          print("LIVE SMTP CONFIGURATION GUARD PASS")
          PY

      - name: Build and start W10 stack
        run: |
          timeout 12m docker compose up -d --build postgres redis e2e-market-provider storage-init api worker worker-outbox worker-email beat

      - name: Prepare stack database
        run: |
          timeout 5m docker compose exec -T api alembic upgrade head
          timeout 3m docker compose exec -T api alembic check
          timeout 3m docker compose exec -T api sh -lc 'test "$(alembic heads | wc -l)" = "1"'

      - name: Wait for application health
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/dependencies >/dev/null; then
              echo "API HEALTH PASS"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200 api worker worker-email
          exit 1

      - name: Compile W10 sources
        run: |
          timeout 2m docker compose exec -T api python -m py_compile scripts/e2e_workforce_w10_dogfood_verify.py app/services/workforce_sales_engagement.py app/services/workforce_sales_outreach_provider.py app/services/workforce_sales_mailbox_provider.py app/workers/email_worker.py

      - name: Run live SMTP governed certification
        run: |
          timeout 5m docker compose exec -T api python scripts/e2e_workforce_w10_dogfood_verify.py

      - name: Failure diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=300 api worker worker-outbox worker-email || true

      - name: Shutdown
        if: always()
        run: |
          timeout 3m docker compose down -v --remove-orphans || true
