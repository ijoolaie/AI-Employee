name: Production Recovery Validation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/production_backup_restore_smoke.sh'
      - '.github/workflows/production-recovery-validation.yml'
      - 'docker-compose.production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-recovery-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore:
    name: Backup and restore recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recovery_ci
          POSTGRES_PASSWORD: recovery_ci_password
          POSTGRES_DB: recovery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recovery_ci -d recovery_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: recovery_ci
      PGPASSWORD: recovery_ci_password
      PGDATABASE: recovery_ci
      PGIMAGE: postgres:16-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run deterministic backup/restore smoke
        timeout-minutes: 1
        run: sh scripts/production_backup_restore_smoke.sh

      - name: Pull PostgreSQL client image once
        timeout-minutes: 2
        run: docker pull "$PGIMAGE"

      - name: Wait for PostgreSQL readiness
        timeout-minutes: 1
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" "$PGIMAGE" \
              pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; then
              echo 'POSTGRES READY'
              exit 0
            fi
            sleep 2
          done
          echo 'POSTGRES READINESS TIMEOUT' >&2
          exit 1

      - name: Seed real PostgreSQL recovery fixture
        timeout-minutes: 1
        run: |
          set -euo pipefail
          timeout 30s docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" "$PGIMAGE" \
            psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS recovery_fixture (
            id integer PRIMARY KEY,
            marker text NOT NULL
          );
          TRUNCATE recovery_fixture;
          INSERT INTO recovery_fixture (id, marker) VALUES (1, 'RECOVERY_CERTIFIED_2026');
          SQL

      - name: Create real PostgreSQL backup
        timeout-minutes: 1
        run: |
          set -euo pipefail
          mkdir -p .recovery
          timeout 30s docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" \
            -v "$PWD/.recovery:/backup" "$PGIMAGE" \
            pg_dump -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
            --format=custom --table=public.recovery_fixture -f /backup/recovery.dump
          test -s .recovery/recovery.dump
          timeout 30s docker run --rm --network host \
            -v "$PWD/.recovery:/backup" "$PGIMAGE" \
            pg_restore --list /backup/recovery.dump | grep -F 'TABLE public recovery_fixture'
          echo 'POSTGRES BACKUP PASS'

      - name: Destroy recovery database contents
        timeout-minutes: 1
        run: |
          set -euo pipefail
          timeout 30s docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" "$PGIMAGE" \
            psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 <<'SQL'
          DROP TABLE IF EXISTS recovery_fixture;
          SQL

      - name: Verify fixture is destroyed
        timeout-minutes: 1
        run: |
          set -euo pipefail
          if timeout 30s docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" "$PGIMAGE" \
            psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -tAc \
            "SELECT to_regclass('public.recovery_fixture')" | grep -q recovery_fixture; then
            echo 'fixture was not destroyed' >&2
            exit 1
          fi
          echo 'DESTRUCTION PASS'

      - name: Restore PostgreSQL backup
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout 60s docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" \
            -v "$PWD/.recovery:/backup" "$PGIMAGE" \
            pg_restore -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
            --clean --if-exists --no-owner --no-acl --exit-on-error \
            --table=public.recovery_fixture /backup/recovery.dump
          echo 'POSTGRES RESTORE PASS'

      - name: Verify restored PostgreSQL data
        timeout-minutes: 1
        run: |
          set -euo pipefail
          marker="$(timeout 30s docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" "$PGIMAGE" \
            psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -tAc \
            "SELECT marker FROM public.recovery_fixture WHERE id=1")"
          test "$marker" = 'RECOVERY_CERTIFIED_2026'
          echo 'POSTGRES RECOVERY DATA VERIFICATION PASS'

      - name: Validate production volumes are declared
        timeout-minutes: 1
        run: |
          grep -F 'postgres_data:' docker-compose.production.yml
          grep -F 'redis_data:' docker-compose.production.yml
          grep -F 'app_storage:' docker-compose.production.yml

      - name: Remove recovery artifacts
        if: always()
        run: rm -rf .recovery
