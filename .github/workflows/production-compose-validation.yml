name: Production Compose Validation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: production-compose-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_USER: prod_ci
      POSTGRES_PASSWORD: 'ci-only-postgres-password'
      POSTGRES_DB: ai_employee_ci
      REDIS_PASSWORD: 'ci-only-redis-password'
      SECRET_KEY: 'ci-only-secret-key-012345678901234567890123456789'
      DATABASE_URL: 'postgresql+asyncpg://prod_ci:ci-only-postgres-password@postgres:5432/ai_employee_ci'
      DATABASE_URL_SYNC: 'postgresql://prod_ci:ci-only-postgres-password@postgres:5432/ai_employee_ci'
      REDIS_URL: 'redis://:ci-only-redis-password@redis:6379/0'
      CELERY_BROKER_URL: 'redis://:ci-only-redis-password@redis:6379/1'
      CELERY_RESULT_BACKEND: 'redis://:ci-only-redis-password@redis:6379/2'
      CORS_ORIGINS: '["https://ci.example.test"]'
      FRONTEND_BASE_URL: 'https://ci.example.test'
      FRONTEND_APP_URL: 'https://ci.example.test'
      NEXT_PUBLIC_API_URL: 'https://ci.example.test/api/v1'
      LM_STUDIO_BASE_URL: 'https://ai.example.test/v1'
      APP_ENV: production
      DEBUG: 'false'
      RATE_LIMIT_ENABLED: 'true'
      RATE_LIMIT_FAIL_CLOSED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep this gate independently executable on every production-config change.
      - name: Validate production compose syntax and required interpolation
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Inspect rendered production topology
        run: |
          set -euo pipefail
          docker compose -f docker-compose.production.yml config > /tmp/production-compose.yml
          grep -q '^  postgres:$' /tmp/production-compose.yml
          grep -q '^  redis:$' /tmp/production-compose.yml
          grep -q '^  api:$' /tmp/production-compose.yml
          grep -q '^  worker:$' /tmp/production-compose.yml
          grep -q '^  beat:$' /tmp/production-compose.yml
          grep -q '^  frontend:$' /tmp/production-compose.yml
          if grep -q '^    ports:' /tmp/production-compose.yml; then
            echo 'Production services must not publish host ports directly.'
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend settings dependencies
        working-directory: backend
        run: pip install -e .

      - name: Validate safe production application settings
        working-directory: backend
        run: python -c "from app.core.config import Settings; Settings()"

      - name: Validate production settings fail closed
        working-directory: backend
        run: |
          set +e
          DEBUG=true \
          CORS_ORIGINS='["http://localhost:3000"]' \
          FRONTEND_BASE_URL='http://localhost:3000' \
          FRONTEND_APP_URL='http://localhost:3000' \
          DATABASE_URL='postgresql+asyncpg://aiep:aiep@remote.example.test:5432/aiep' \
          DATABASE_URL_SYNC='postgresql://aiep:aiep@remote.example.test:5432/aiep' \
          REDIS_URL='redis://remote.example.test:6379/0' \
          CELERY_BROKER_URL='redis://remote.example.test:6379/1' \
          CELERY_RESULT_BACKEND='redis://remote.example.test:6379/2' \
          LM_STUDIO_BASE_URL='http://ai.example.test/v1' \
          SECRET_KEY='ci-only-secret-key-012345678901234567890123456789' \
          APP_ENV=production \
          RATE_LIMIT_ENABLED=true \
          RATE_LIMIT_FAIL_CLOSED=true \
          python -c "from app.core.config import Settings; Settings()"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Unsafe production configuration unexpectedly passed application validation.'
            exit 1
          fi
          echo 'Unsafe production configuration is rejected as expected.'
