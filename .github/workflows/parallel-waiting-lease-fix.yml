name: one-shot parallel waiting lease fix
on:
  push:
    branches:
      - fix/parallel-branch-terminal-fence
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply waiting-state lease cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/services/workflow_service.py')
          s = p.read_text()
          old = '                if not all(b.status == "success" for b in branches): step.status = "waiting_parallel"; await db.flush(); return\n'
          new = '                if not all(b.status == "success" for b in branches):\n                    step.status = "waiting_parallel"\n                    run.execution_lease_id = None\n                    run.execution_lease_expires_at = None\n                    run.execution_heartbeat_at = None\n                    await db.flush()\n                    return run\n'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          helper = Path('.github/workflows/parallel-waiting-lease-fix.yml')
          helper.unlink()
          PY
      - name: Commit patched implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/services/workflow_service.py .github/workflows/parallel-waiting-lease-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'P1: release workflow lease while waiting for parallel branches'
          git push origin HEAD:fix/parallel-branch-terminal-fence
