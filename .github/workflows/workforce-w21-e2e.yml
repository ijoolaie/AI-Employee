name: W21 AI Business Network E2E
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/workforce-w21-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/workforce-w21-e2e.yml"
jobs:
  w21-real-stack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiep
          POSTGRES_PASSWORD: aiep
          POSTGRES_DB: aiep
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql+asyncpg://aiep:aiep@localhost:5432/aiep
      SECRET_KEY: w21-e2e-secret
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: alembic -c alembic.ini upgrade head
        working-directory: backend
      - run: python -m py_compile app/models/business_network_request.py app/services/business_network_service.py app/api/v1/business_network.py app/schemas/business_network.py scripts/e2e_workforce_w21_business_network_verify.py
        working-directory: backend
      - run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 </dev/null > /tmp/w21-api.log 2>&1 & echo $! > /tmp/w21-api.pid
        working-directory: backend
      - name: Wait for API health
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/health"
          last_error = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          print("W21 API health check passed")
                          break
              except (urllib.error.URLError, TimeoutError) as exc:
                  last_error = exc
              time.sleep(1)
          else:
              print(f"W21 API did not become healthy: {last_error}")
              raise SystemExit(1)
          PY
      - run: python scripts/e2e_workforce_w21_business_network_verify.py
        working-directory: backend
      - if: failure()
        run: cat /tmp/w21-api.log
