name: Workforce W10 Internal Company Dogfood E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/app/ai/tool_registry.py"
      - "backend/app/services/ai_workforce_roles.py"
      - "backend/app/services/workforce_semantic_domains.py"
      - "backend/app/services/workforce_sales_outreach_provider.py"
      - "backend/app/services/workforce_sales_engagement.py"
      - "backend/app/services/workforce_sales_inbound_provider.py"
      - "backend/app/services/workforce_sales_mailbox_provider.py"
      - "backend/tests/test_workforce_sales_mailbox_provider.py"
      - "backend/app/api/v1/sales_webhooks.py"
      - "backend/tests/test_workforce_sales_inbound_provider.py"
      - "backend/scripts/e2e_workforce_w10_dogfood_verify.py"
      - "backend/scripts/e2e_smtp_sink.py"
      - ".github/workflows/workforce-w10-dogfood-e2e.yml"
      - "backend/app/core/config.py"
      - "backend/app/services/workforce_sales_payment_provider.py"
      - "backend/app/services/stripe_service.py"
      - "backend/app/models/workforce_revenue_event.py"
      - "backend/alembic/versions/w10_workforce_revenue_event.py"
      - "backend/scripts/e2e_workforce_w10_revenue_reconciliation_verify.py"
      - "backend/tests/test_workforce_revenue_event.py"
      - "backend/tests/test_workforce_sales_payment_provider.py"
      - "backend/scripts/e2e_workforce_w10_commercial_commitment_verify.py"
      - "docker-compose.yml"
  pull_request:
    paths:
      - "backend/app/ai/tool_registry.py"
      - "backend/app/services/ai_workforce_roles.py"
      - "backend/app/services/workforce_semantic_domains.py"
      - "backend/scripts/e2e_workforce_w10_dogfood_verify.py"
      - "backend/scripts/e2e_workforce_w10_commercial_commitment_verify.py"
      - ".github/workflows/workforce-w10-dogfood-e2e.yml"

concurrency:
  group: workforce-w10-dogfood-${{ github.ref }}
  cancel-in-progress: true

env:
  SALES_OUTREACH_PROVIDER_NAME: smtp
  SALES_PAYMENT_PROVIDER_NAME: contract-test
  SMTP_HOST: smtp-test
  SMTP_PORT: "2525"
  SMTP_FROM_EMAIL: ai-employee@example.invalid
  SMTP_USE_STARTTLS: "false"
  SMTP_ALLOWED_RECIPIENT_DOMAINS: '["example.invalid"]'
  W10_SALES_RECIPIENT_EMAIL: w10-prospect@example.invalid
  SALES_INBOUND_PROVIDER_NAME: generic-webhook
  SALES_INBOUND_CONTRACT_SECRET: w10-contract-secret
  SALES_INBOUND_TENANT_ID: 00000000-0000-0000-0000-000000000010
  SALES_INBOUND_WEBHOOK_SECRETS: '{"00000000-0000-0000-0000-000000000010":"w10-generic-webhook-secret"}'

permissions:
  contents: read

jobs:
  w10-real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build and start W10 stack
        run: |
          timeout 12m docker compose up -d --build postgres redis smtp-test e2e-market-provider storage-init api worker worker-outbox worker-email beat

      - name: Prepare stack database