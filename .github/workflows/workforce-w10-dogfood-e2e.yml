name: Workforce W10 Internal Company Dogfood E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/requirements.txt"
      - "backend/app/ai/tool_registry.py"
      - "backend/app/services/ai_workforce_roles.py"
      - "backend/app/services/workforce_semantic_domains.py"
      - "backend/app/services/workforce_sales_outreach_provider.py"
      - "backend/app/services/workforce_sales_engagement.py"
      - "backend/app/services/workforce_sales_inbound_provider.py"
      - "backend/app/services/workforce_sales_mailbox_provider.py"
      - "backend/tests/test_workforce_sales_mailbox_provider.py"
      - "backend/app/api/v1/sales_webhooks.py"
      - "backend/tests/test_workforce_sales_inbound_provider.py"
      - "backend/scripts/e2e_workforce_w10_dogfood_verify.py"
      - "backend/scripts/e2e_smtp_sink.py"
      - ".github/workflows/workforce-w10-dogfood-e2e.yml"
      - "backend/app/core/config.py"
      - "backend/app/services/workforce_sales_payment_provider.py"
      - "backend/app/services/stripe_service.py"
      - "backend/app/services/zarinpal_service.py"
      - "backend/app/api/v1/zarinpal_webhooks.py"
      - "backend/app/models/workforce_revenue_event.py"
      - "backend/alembic/versions/w10_workforce_revenue_event.py"
      - "backend/scripts/e2e_workforce_w10_revenue_reconciliation_verify.py"
      - "backend/scripts/e2e_workforce_w10_zarinpal_reconciliation_idempotency_verify.py"
      - "backend/tests/test_zarinpal_webhooks.py"
      - "backend/tests/test_workforce_revenue_event.py"
      - "backend/tests/test_workforce_sales_payment_provider.py"
      - "backend/tests/test_zarinpal_webhooks.py"
      - "backend/scripts/e2e_workforce_w10_commercial_commitment_verify.py"
      - "docker-compose.yml"
  pull_request:
    paths:
      - "backend/requirements.txt"
      - "backend/app/ai/tool_registry.py"
      - "backend/app/services/ai_workforce_roles.py"
      - "backend/app/services/workforce_semantic_domains.py"
      - "backend/scripts/e2e_workforce_w10_dogfood_verify.py"
      - "backend/scripts/e2e_workforce_w10_commercial_commitment_verify.py"
      - "backend/scripts/e2e_workforce_w10_zarinpal_reconciliation_idempotency_verify.py"
      - ".github/workflows/workforce-w10-dogfood-e2e.yml"

concurrency:
  group: workforce-w10-dogfood-${{ github.ref }}
  cancel-in-progress: true

env:
  SALES_OUTREACH_PROVIDER_NAME: smtp
  SALES_PAYMENT_PROVIDER_NAME: contract-test
  SMTP_HOST: smtp-test
  SMTP_PORT: "2525"
  SMTP_FROM_EMAIL: ai-employee@example.invalid
  SMTP_USE_STARTTLS: "false"
  SMTP_ALLOWED_RECIPIENT_DOMAINS: '["example.invalid"]'
  W10_SALES_RECIPIENT_EMAIL: w10-prospect@example.invalid
  SALES_INBOUND_PROVIDER_NAME: generic-webhook
  SALES_INBOUND_CONTRACT_SECRET: w10-contract-secret
  SALES_INBOUND_TENANT_ID: 00000000-0000-0000-0000-000000000010
  SALES_INBOUND_WEBHOOK_SECRETS: '{"00000000-0000-0000-0000-000000000010":"w10-generic-webhook-secret"}'

permissions:
  contents: read

jobs:
  w10-real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build and start W10 stack
        run: |
          timeout 12m docker compose up -d --build postgres redis smtp-test e2e-market-provider storage-init api worker worker-outbox worker-email beat

      - name: Prepare stack database
        run: |
          timeout 5m docker compose exec -T api alembic upgrade head
          timeout 3m docker compose exec -T api alembic check
          timeout 3m docker compose exec -T api sh -lc 'test "$(alembic heads | wc -l)" = "1"'

      - name: Wait for application health
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/dependencies >/dev/null; then
              echo "API HEALTH PASS"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200 api worker
          exit 1

      - name: Verify W10 provider configuration
        run: |
          docker compose exec -T api python -c 'from app.core.config import get_settings; s=get_settings(); print("W10 provider config:", s.sales_outreach_provider_name, s.sales_payment_provider_name)'

      - name: Compile W10 sources
        run: |
          timeout 2m docker compose exec -T api python -m py_compile scripts/e2e_workforce_w10_dogfood_verify.py scripts/e2e_workforce_w10_commercial_commitment_verify.py scripts/e2e_workforce_w10_revenue_reconciliation_verify.py scripts/e2e_workforce_w10_zarinpal_reconciliation_idempotency_verify.py scripts/e2e_smtp_sink.py app/services/workforce_semantic_domains.py app/services/ai_workforce_roles.py app/services/workforce_sales_engagement.py app/services/workforce_sales_outreach_provider.py app/services/workforce_sales_inbound_provider.py app/services/workforce_sales_mailbox_provider.py app/services/stripe_service.py app/services/zarinpal_service.py app/api/v1/zarinpal_webhooks.py app/models/workforce_revenue_event.py app/api/v1/sales_webhooks.py app/workers/email_worker.py

      - name: Run sales provider unit tests
        run: |
          timeout 3m docker compose exec -T api pytest -q tests/test_workforce_sales_inbound_provider.py tests/test_workforce_sales_mailbox_provider.py tests/test_workforce_sales_payment_provider.py tests/test_zarinpal_service.py tests/test_zarinpal_webhooks.py tests/test_workforce_revenue_event.py

      - name: Run W10 real-stack certification
        run: |
          timeout 8m docker compose exec -T api python scripts/e2e_workforce_w10_dogfood_verify.py

      - name: Run governed commercial commitment certification
        env:
          SALES_INBOUND_TENANT_ID: ""
        run: |
          timeout 8m docker compose exec -T api python scripts/e2e_workforce_w10_commercial_commitment_verify.py

      - name: Run synthetic Stripe revenue reconciliation certification
        run: |
          timeout 8m docker compose exec -T api python scripts/e2e_workforce_w10_revenue_reconciliation_verify.py

      - name: Run synthetic ZarinPal revenue idempotency certification
        run: |
          timeout 8m docker compose exec -T api python scripts/e2e_workforce_w10_zarinpal_reconciliation_idempotency_verify.py

      - name: Verify governed SMTP delivery
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T smtp-test sh -lc 'test -s /smtp-outbox/messages.eml && grep -q "Governed AI workforce for customer operations" /smtp-outbox/messages.eml'; then
              echo "W10 SMTP EXTERNAL DELIVERY PASS"
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=200 worker-email smtp-test
          docker compose exec -T smtp-test sh -lc 'ls -la /smtp-outbox && cat /smtp-outbox/messages.eml 2>/dev/null || true'
          exit 1

      - name: Failure diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=300 api worker worker-outbox beat || true

      - name: Shutdown
        if: always()
        run: |
          timeout 3m docker compose down -v --remove-orphans || true

# W10 generic-webhook certification: explicit tenant-scoped HMAC secret; no wildcard fixture.
