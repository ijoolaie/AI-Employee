name: Release Artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to package, e.g. v1.2.0'
        required: true
        type: string
      ref:
        description: 'Exact branch, tag, or commit SHA to package'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifact-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/backend

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Determine release version and exact release ref
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME}"
            release_ref="${GITHUB_REF}"
          else
            version="${{ inputs.version }}"
            release_ref="${{ inputs.ref }}"
          fi
          [[ "$version" == v* ]] || { echo "Release version must start with v"; exit 1; }
          [[ -n "$release_ref" ]] || { echo "Release ref must not be empty"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.release_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify checked-out commit identity
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Release version: ${{ steps.release.outputs.version }}"
          echo "Release ref: ${{ steps.release.outputs.release_ref }}"
          echo "Release commit: $checked_out_sha"
          echo "release_commit=$checked_out_sha" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install backend dependencies for migration verification
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Validate edition profile contracts
        run: python scripts/validate_edition_profiles.py

      - name: Run edition contract tests
        run: python -m pytest backend/tests/test_phase6_edition_profiles.py -q

      - name: Build immutable runtime package
        run: python scripts/build_release_package.py "${{ steps.release.outputs.version }}"

      - name: Generate release notes from exact release ref
        shell: bash
        run: |
          set -euo pipefail
          notes_tool_commit="396d17dbec5cf5a8b67f346c9e497ea7f60f1f44"
          git show "${notes_tool_commit}:scripts/generate_release_notes.py" > /tmp/generate_release_notes.py
          python /tmp/generate_release_notes.py "${{ steps.release.outputs.version }}"

      - name: Build Vendor, Reseller and Customer packages
        run: |
          python scripts/build_edition_packages.py \
            "${{ steps.release.outputs.version }}" \
            "$release_commit" \
            --out "dist/editions/${{ steps.release.outputs.version }}"

      - name: Verify base package checksum
        working-directory: dist/release
        run: sha256sum -c SHA256SUMS

      - name: Verify Vendor, Reseller and Customer packages
        run: python scripts/validate_edition_packages.py "dist/editions/${{ steps.release.outputs.version }}"

      - name: Upload base runtime package
        uses: actions/upload-artifact@v4
        with:
          name: ai-employee-${{ steps.release.outputs.version }}-runtime
          path: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
            dist/release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 90

      - name: Upload three edition packages
        uses: actions/upload-artifact@v4
        with:
          name: ai-employee-${{ steps.release.outputs.version }}-editions
          path: dist/editions/${{ steps.release.outputs.version }}/
          if-no-files-found: error
          retention-days: 90
