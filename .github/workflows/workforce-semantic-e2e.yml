# Deterministic local real-stack semantic gate.
name: Workforce Semantic Real-Stack E2E

on:
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/scripts/e2e_workforce_semantic_verify.py"
      - "backend/scripts/e2e_market_data_provider.py"
      - "backend/tests/**"
      - "docker-compose.yml"
      - ".github/workflows/workforce-semantic-e2e.yml"
  workflow_dispatch:

concurrency:
  group: workforce-semantic-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEFAULT_VENDOR_TENANT_SLUG: ci-default-vendor
      DEFAULT_VENDOR_BOOTSTRAP_TENANT_NAME: CI Default Vendor
      DEFAULT_VENDOR_BOOTSTRAP_ADMIN_EMAIL: ci-vendor-admin@example.com
      DEFAULT_VENDOR_BOOTSTRAP_ADMIN_PASSWORD: ci-only-bootstrap-password-2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start deterministic real stack
        run: |
          docker compose up -d postgres redis storage-init e2e-market-provider api worker worker-outbox beat

      - name: Wait for dependencies
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/dependencies >/dev/null; then
              echo "API HEALTH PASS"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color --tail=200 api e2e-market-provider worker worker-outbox beat
          exit 1

      - name: Verify migration graph
        run: |
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api alembic check

      - name: Bootstrap isolated default Vendor for signup tests
        run: docker compose exec -T api python scripts/bootstrap_default_vendor.py

      - name: Verify deterministic market provider
        run: |
          docker compose exec -T e2e-market-provider python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).read()"
          docker compose exec -T api python -m py_compile scripts/e2e_workforce_semantic_verify.py scripts/e2e_market_data_provider.py

      - name: Run semantic Workforce real-stack matrix with PostgreSQL wait diagnostics
        run: |
          set -uo pipefail
          docker compose exec -T -e PYTHONPATH=/app api python scripts/e2e_workforce_semantic_verify.py &
          test_pid=$!
          (
            for sample in $(seq 1 100); do
              kill -0 "$test_pid" 2>/dev/null || break
              echo "=== PostgreSQL activity $(date -u +%FT%TZ) ==="
              docker compose exec -T postgres psql -U aiep -d aiep -X -A -t -c "SELECT pid, application_name, state, COALESCE(wait_event_type, chr(45)), COALESCE(wait_event, chr(45)), pg_blocking_pids(pid), LEFT(query, 300) FROM pg_stat_activity WHERE datname=current_database() AND pid<>pg_backend_pid() ORDER BY pid;" || true
              echo "=== PostgreSQL blocked locks $(date -u +%FT%TZ) ==="
              docker compose exec -T postgres psql -U aiep -d aiep -X -A -t -c "WITH waiters AS (SELECT a.pid AS waiting_pid, unnest(pg_blocking_pids(a.pid)) AS blocking_pid FROM pg_stat_activity a WHERE a.datname=current_database() AND a.pid<>pg_backend_pid() AND cardinality(pg_blocking_pids(a.pid))>0), participants AS (SELECT waiting_pid AS pid, chr(119)||chr(97)||chr(105)||chr(116)||chr(105)||chr(110)||chr(103) AS role FROM waiters UNION SELECT blocking_pid AS pid, chr(98)||chr(108)||chr(111)||chr(99)||chr(107)||chr(105)||chr(110)||chr(103) AS role FROM waiters) SELECT p.role, a.pid, a.state, COALESCE(a.wait_event_type, chr(45)), COALESCE(a.wait_event, chr(45)), a.xact_start, a.query_start, a.backend_xid, pg_blocking_pids(a.pid), l.locktype, l.mode, l.granted, COALESCE(l.relation::regclass::text, chr(45)), COALESCE(l.page::text, chr(45)), COALESCE(l.tuple::text, chr(45)), COALESCE(l.transactionid::text, chr(45)), a.backend_xid, a.backend_xmin, LEFT(a.query, 500) FROM participants p JOIN pg_stat_activity a ON a.pid=p.pid LEFT JOIN pg_locks l ON l.pid=a.pid WHERE l.pid IS NULL OR NOT l.granted OR l.locktype IN (chr(116)||chr(114)||chr(97)||chr(110)||chr(115)||chr(97)||chr(99)||chr(116)||chr(105)||chr(111)||chr(110)||chr(105)||chr(100), chr(116)||chr(117)||chr(112)||chr(108)||chr(101)) OR l.relation::regclass::text IN (chr(116)||chr(101)||chr(110)||chr(97)||chr(110)||chr(116)||chr(115), chr(114)||chr(117)||chr(110)||chr(115), chr(97)||chr(105)||chr(95)||chr(112)||chr(114)||chr(111)||chr(118)||chr(105)||chr(100)||chr(101)||chr(114)||chr(95)||chr(99)||chr(97)||chr(108)||chr(108)||chr(115)) ORDER BY p.role, a.pid;" || true
              sleep 5
            done
          ) &
          sampler_pid=$!
          wait "$test_pid"
          test_status=$?
          kill "$sampler_pid" 2>/dev/null || true
          wait "$sampler_pid" 2>/dev/null || true
          exit "$test_status"
      - name: Collect diagnostics
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=250 api worker worker-outbox beat e2e-market-provider

      - name: Shutdown
        if: always()
        run: docker compose down -v --remove-orphans
