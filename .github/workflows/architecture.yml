name: Architecture Guard

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/check_architecture.py'
      - 'scripts/final_architecture_audit.py'
      - 'scripts/production_completeness_audit.py'
      - 'scripts/**'
      - 'docs/releases/**'
      - '.github/workflows/architecture.yml'
      - 'docker-compose*.yml'
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'docs/releases/**'
      - '.github/workflows/architecture.yml'
      - 'docker-compose*.yml'

concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Check modular architecture
        run: python scripts/check_architecture.py
      - name: Run modular architecture tests
        run: python -m pytest backend/tests/test_m3_infrastructure_boundaries.py backend/tests/test_m4_event_boundaries.py backend/tests/test_m7_real_migration.py backend/tests/test_edition_boundaries.py
      - name: Final architecture audit
        run: python scripts/final_architecture_audit.py
      - name: Production completeness baseline
        run: python scripts/production_completeness_audit.py
