name: Phase 14.14 Security Privacy Compliance Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ai/tool_registry.py'
      - 'backend/app/core/deps.py'
      - 'backend/app/services/**'
      - 'backend/tests/**security**'
      - 'backend/tests/**privacy**'
      - 'backend/requirements.lock'
      - 'backend/pyproject.toml'
      - 'docs/current/PHASE_14_14_SECURITY_PRIVACY_COMPLIANCE.md'
      - '.github/workflows/phase-14-14-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-secret
      APP_ENV: test
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend from direct dependency lock
        working-directory: backend
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Run security and privacy regression suite
        working-directory: backend
        run: pytest -q tests/test_phase_14_14_security_regressions.py
      - name: Run Ruff security-relevant static baseline
        working-directory: backend
        run: ruff check app tests/test_phase_14_14_security_regressions.py
      - name: Audit locked dependencies
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements.lock
      - name: Write evidence identity
        run: |
          mkdir -p phase-14-14-security-evidence
          printf 'commit_sha=%s\n' "$GITHUB_SHA" > phase-14-14-security-evidence/identity.env
          date -u +%Y-%m-%dT%H:%M:%SZ > phase-14-14-security-evidence/timestamp.txt
          printf 'scope=security-privacy-compliance-engineering\nexternal_pentest=not_claimed\ncompliance_certification=not_claimed\n' >> phase-14-14-security-evidence/identity.env
      - name: Upload security evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-14-14-security-${{ github.sha }}
          path: phase-14-14-security-evidence/
          if-no-files-found: error
