name: temporary lease integration
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
  pull-requests: read
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/workflow-execution-lease-fencing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workflow-execution-lease-fencing
          fetch-depth: 0
      - name: integrate lease fencing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/app/services/workflow_service.py')
          s=p.read_text()
          marker='from app.core.metrics import WORKFLOW_STEPS\n'
          imp=marker+'from app.services.workflow_execution_lease import acquire_workflow_execution_lease, assert_workflow_execution_lease, heartbeat_workflow_execution_lease\n'
          if 'acquire_workflow_execution_lease' not in s:
              s=s.replace(marker,imp,1)
          old='''    if run.status not in {"pending", "waiting_approval"}:\n        return run\n    now = datetime.now(timezone.utc)\n    if run.deadline_at and run.deadline_at <= now:\n'''
          new='''    if run.status not in {"pending", "waiting_approval", "running"}:\n        return run\n    now = datetime.now(timezone.utc)\n    if run.deadline_at and run.deadline_at <= now:\n'''
          s=s.replace(old,new,1)
          old='''    run.status = "running"\n    if run.started_at is None: run.started_at = datetime.now(timezone.utc)\n    await db.flush()\n    try:\n        for position in range(start_position, len(steps)):\n'''
          new='''    if run.status == "running":\n        if run.deadline_at is None or not run.execution_lease_expires_at or run.execution_lease_expires_at <= now:\n            lease_id = await acquire_workflow_execution_lease(db, workflow_run_id=run.id, allow_recovery=bool(run.deadline_at))\n        else:\n            raise ValidationAppError("WORKFLOW_EXECUTION_LEASE_LOST")\n    else:\n        lease_id = await acquire_workflow_execution_lease(db, workflow_run_id=run.id)\n    run = await assert_workflow_execution_lease(db, workflow_run_id=run.id, lease_id=lease_id)\n    if run.started_at is None: run.started_at = datetime.now(timezone.utc)\n    await db.flush()\n    try:\n        for position in range(start_position, len(steps)):\n            await assert_workflow_execution_lease(db, workflow_run_id=run.id, lease_id=lease_id)\n            await heartbeat_workflow_execution_lease(db, workflow_run_id=run.id, lease_id=lease_id)\n'''
          if old not in s: raise SystemExit('execution start pattern not found')
          s=s.replace(old,new,1)
          old='''            definition = steps[position]\n'''
          new='''            await assert_workflow_execution_lease(db, workflow_run_id=run.id, lease_id=lease_id)\n            definition = steps[position]\n'''
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/workflow_service.py
          git commit -m 'feat: fence workflow execution with durable lease' || true
          git push origin HEAD:fix/workflow-execution-lease-fencing
          rm .github/workflows/_lease_patch.yml
          git add .github/workflows/_lease_patch.yml
          git commit -m 'chore: remove temporary lease patch workflow'
          git push origin HEAD:fix/workflow-execution-lease-fencing
