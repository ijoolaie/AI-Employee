name: _lease-hardening-apply
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/workflow-execution-lease-fencing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Apply lease hardening
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/app/services/workflow_service.py')
          s = p.read_text()
          old = '''async def execute_workflow(db: AsyncSession, *, workflow_run_id: uuid.UUID) -> WorkflowRun:'''
          new = '''async def execute_workflow(db: AsyncSession, *, workflow_run_id: uuid.UUID, execution_lease_id: uuid.UUID | None = None) -> WorkflowRun:'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    if run.status == "running":
        if run.deadline_at is None or not run.execution_lease_expires_at or run.execution_lease_expires_at <= now:
            lease_id = await acquire_workflow_execution_lease(db, workflow_run_id=run.id, allow_recovery=bool(run.deadline_at))
        else:
            raise ValidationAppError("WORKFLOW_EXECUTION_LEASE_LOST")
    else:
        lease_id = await acquire_workflow_execution_lease(db, workflow_run_id=run.id)
'''
          new = '''    if execution_lease_id is not None:
        lease_id = execution_lease_id
    elif run.status == "running":
        if run.deadline_at is None or not run.execution_lease_expires_at or run.execution_lease_expires_at <= now:
            lease_id = await acquire_workflow_execution_lease(db, workflow_run_id=run.id, allow_recovery=bool(run.deadline_at))
        else:
            raise ValidationAppError("WORKFLOW_EXECUTION_LEASE_LOST")
    else:
        lease_id = await acquire_workflow_execution_lease(db, workflow_run_id=run.id)
'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''                    step.employee_run_id = child.id
                    await run_service.execute_run(db, run_id=child.id)
'''
          new = '''                    step.employee_run_id = child.id
                    # Durably publish the child identity before crossing the
                    # external execution boundary. A recovery worker can then
                    # observe the authoritative child Run instead of creating
                    # a duplicate while the original worker is in-flight.
                    await db.commit()
                    await assert_workflow_execution_lease(db, workflow_run_id=run.id, lease_id=lease_id)
                    await run_service.execute_run(db, run_id=child.id)
'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('backend/app/workers/workflow_worker.py')
          s = p.read_text()
          old = '''            except Exception:
                await db.commit()
'''
          new = '''            except Exception as exc:
                if "WORKFLOW_EXECUTION_LEASE_LOST" in str(exc):
                    await db.rollback()
                else:
                    await db.commit()
'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('backend/app/workers/workflow_trigger_worker.py')
          s = p.read_text()
          old = '''async def _timeout_workflow_runs_async() -> int:
    from sqlalchemy import select
    from app.models.workflow import WorkflowRun, WorkflowStepRun
    from app.services import audit_service
    now = datetime.now(timezone.utc)
    count = 0
    async with worker_db_session() as db:
'''
          new = '''async def _timeout_workflow_runs_async() -> int:
    from sqlalchemy import select
    from app.models.workflow import WorkflowRun, WorkflowStepRun
    from app.services import audit_service
    from app.services.workflow_execution_lease import recover_workflow_execution_lease
    from app.services.outbox_service import enqueue
    now = datetime.now(timezone.utc)
    count = 0
    recovered = 0
    async with worker_db_session() as db:
        stale = await db.execute(
            select(WorkflowRun).where(
                WorkflowRun.status == "running",
                WorkflowRun.deadline_at.is_not(None),
                WorkflowRun.deadline_at > now,
                WorkflowRun.execution_lease_id.is_not(None),
                WorkflowRun.execution_lease_expires_at.is_not(None),
                WorkflowRun.execution_lease_expires_at <= now,
            ).with_for_update(skip_locked=True)
        )
        for run in stale.scalars().all():
            await recover_workflow_execution_lease(db, workflow_run_id=run.id)
            await enqueue(
                db,
                kind="workflow.execute",
                tenant_id=run.tenant_id,
                payload={"workflow_run_id": str(run.id)},
                dedupe_key=f"workflow.execute:{run.id}:lease-recovery",
            )
            recovered += 1
        await db.flush()
'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        await db.commit()
    return count
'''
          new = '''        await db.commit()
    return count + recovered
'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/_lease_hardening_apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/workflow_service.py backend/app/workers/workflow_worker.py backend/app/workers/workflow_trigger_worker.py .github/workflows/_lease_hardening_apply.yml
          git diff --cached --check
          git commit -m 'fix: harden workflow lease recovery boundaries'
          git push