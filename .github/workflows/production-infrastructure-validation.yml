name: Production Infrastructure Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker-compose.production.yml'
      - 'docker-compose.local-production.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/production_infrastructure_validation.sh'
      - 'scripts/production_backup_restore_smoke.sh'
      - '.github/workflows/production-infrastructure-validation.yml'
      - '.github/workflows/immutable-release-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'docker-compose.production.yml'
      - 'docker-compose.local-production.yml'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/production_infrastructure_validation.sh'
      - 'scripts/production_backup_restore_smoke.sh'
      - '.github/workflows/production-infrastructure-validation.yml'
      - '.github/workflows/immutable-release-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-infrastructure-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_USER: prod_ci
      POSTGRES_PASSWORD: ci-only-postgres-password
      POSTGRES_DB: ai_employee_ci
      REDIS_PASSWORD: ci-only-redis-password
      SECRET_KEY: ci-only-secret-key-012345678901234567890123456789
      DATABASE_URL: postgresql+asyncpg://prod_ci:ci-only-postgres-password@postgres:5432/ai_employee_ci
      DATABASE_URL_SYNC: postgresql://prod_ci:ci-only-postgres-password@postgres:5432/ai_employee_ci
      REDIS_URL: redis://:ci-only-redis-password@redis:6379/0
      CELERY_BROKER_URL: redis://:ci-only-redis-password@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:ci-only-redis-password@redis:6379/2
      CORS_ORIGINS: '["http://127.0.0.1:13000"]'
      FRONTEND_BASE_URL: http://127.0.0.1:13000
      FRONTEND_APP_URL: http://127.0.0.1:13000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:18000/api/v1
      LM_STUDIO_BASE_URL: https://ai.example.test/v1
      SMTP_ALLOWED_RECIPIENT_DOMAINS: '[]'
      STRIPE_PRICE_MAP: '{}'
      APP_ENV: production
      DEBUG: 'false'
      RATE_LIMIT_ENABLED: 'true'
      RATE_LIMIT_FAIL_CLOSED: 'true'
      COMPOSE_PROJECT_NAME: ai-employee-infra-validation
      ENV_FILE: .env.production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create ephemeral production validation environment
        run: |
          cat > .env.production <<'EOF'
          POSTGRES_USER=prod_ci
          POSTGRES_PASSWORD=ci-only-postgres-password
          POSTGRES_DB=ai_employee_ci
          SECRET_KEY=ci-only-secret-key-012345678901234567890123456789
          DATABASE_URL=postgresql+asyncpg://prod_ci:ci-only-postgres-password@postgres:5432/ai_employee_ci
          DATABASE_URL_SYNC=postgresql://prod_ci:ci-only-postgres-password@postgres:5432/ai_employee_ci
          REDIS_PASSWORD=ci-only-redis-password
          REDIS_URL=redis://:ci-only-redis-password@redis:6379/0
          CELERY_BROKER_URL=redis://:ci-only-redis-password@redis:6379/1
          CELERY_RESULT_BACKEND=redis://:ci-only-redis-password@redis:6379/2
          CORS_ORIGINS=["http://127.0.0.1:13000"]
          FRONTEND_BASE_URL=http://127.0.0.1:13000
          FRONTEND_APP_URL=http://127.0.0.1:13000
          NEXT_PUBLIC_API_URL=http://127.0.0.1:18000/api/v1
          LM_STUDIO_BASE_URL=https://ai.example.test/v1
          SMTP_ALLOWED_RECIPIENT_DOMAINS=[]
          STRIPE_PRICE_MAP={}
          EOF
      - name: Validate production compose contract
        run: docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml config --quiet
      - name: Build production application images in parallel
        run: docker compose --parallel=4 --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" build api worker beat frontend
      - name: Start infrastructure dependencies
        run: docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" up -d postgres redis storage-init
      - name: Wait for infrastructure readiness
        run: |
          for _ in $(seq 1 30); do
            pg_ready=$(docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1 && echo yes || echo no)
            redis_ready=$(docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" exec -T redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG && echo yes || echo no)
            if [[ "$pg_ready" == yes && "$redis_ready" == yes ]]; then exit 0; fi
            sleep 2
          done
          docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" ps
          exit 1
      - name: Run database migrations before API readiness gate
        run: docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" run --rm --no-deps api alembic upgrade head
      - name: Start API Worker Beat and Frontend
        run: docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" up -d api worker beat frontend
      - name: Validate PostgreSQL Redis API Worker Beat Frontend lifecycle and persistence
        run: bash scripts/production_infrastructure_validation.sh
      - name: Validate real PostgreSQL backup and isolated restore
        run: bash scripts/production_backup_restore_smoke.sh
      - name: Capture service state and logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" ps
          docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" logs --no-color --tail=200 api worker beat frontend postgres redis || true
      - name: Tear down ephemeral stack
        if: always()
        run: docker compose --env-file .env.production -f docker-compose.production.yml -f docker-compose.local-production.yml -p "$COMPOSE_PROJECT_NAME" down --volumes --remove-orphans

  timeout-fence-helper:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/workflow-timeout-terminal-fence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/services/workflow_service.py')
          s = p.read_text()
          old = '''        fresh = await db.execute(select(WorkflowRun.status).where(WorkflowRun.id == run.id))
        if fresh.scalar_one() == "cancelled": run.status = "cancelled"; return run
        run.context = context; run.output_data = context.get("steps", {}); run.status = "success"; run.completed_at = datetime.now(timezone.utc); await db.flush(); await audit_service.record(db, action="workflow.run.completed", actor_type="system", tenant_id=run.tenant_id, resource_type="workflow_run", resource_id=run.id, status="success", request_id=request_id_var.get(), metadata={"status": run.status}); return run
'''
          new = '''        terminal_check = await db.execute(select(WorkflowRun).where(WorkflowRun.id == run.id).with_for_update())
        terminal_run = terminal_check.scalar_one()
        terminal_now = datetime.now(timezone.utc)
        if terminal_run.status == "cancelled":
            run.status = "cancelled"
            return run
        if terminal_run.status != "running":
            return terminal_run
        if terminal_run.deadline_at and terminal_run.deadline_at <= terminal_now:
            terminal_run.status = "timed_out"
            terminal_run.error = {"code": "WORKFLOW_TIMEOUT", "message": "Workflow run exceeded its configured runtime."}
            terminal_run.completed_at = terminal_now
            await db.flush()
            await audit_service.record(db, action="workflow.run.timed_out", actor_type="system", tenant_id=terminal_run.tenant_id, resource_type="workflow_run", resource_id=terminal_run.id, status="failure", request_id=request_id_var.get(), metadata={"deadline_at": terminal_run.deadline_at.isoformat()})
            return terminal_run
        run.context = context
        run.output_data = context.get("steps", {})
        run.status = "success"
        run.completed_at = terminal_now
        await db.flush()
        await audit_service.record(db, action="workflow.run.completed", actor_type="system", tenant_id=run.tenant_id, resource_type="workflow_run", resource_id=run.id, status="success", request_id=request_id_var.get(), metadata={"status": run.status})
        return run
'''
          if old not in s:
              raise SystemExit('terminal block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/services/workflow_service.py
          git diff --cached --quiet || git commit -m "fix: fence workflow timeout terminal transition"
          git push
