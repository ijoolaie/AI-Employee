services:
  postgres:
    ports:
      - "127.0.0.1:${LOCAL_PRODUCTION_POSTGRES_PORT:-15432}:5432"

  redis:
    ports:
      - "127.0.0.1:${LOCAL_PRODUCTION_REDIS_PORT:-16379}:6379"

  api:
    ports:
      - "127.0.0.1:${LOCAL_PRODUCTION_API_PORT:-18000}:8000"
    environment:
      LOCAL_PRODUCTION_ALLOW_HTTP: "true"

  worker:
    environment:
      LOCAL_PRODUCTION_ALLOW_HTTP: "true"

  beat:
    environment:
      LOCAL_PRODUCTION_ALLOW_HTTP: "true"

  frontend:
    ports:
      - "127.0.0.1:${LOCAL_PRODUCTION_FRONTEND_PORT:-13000}:3000"
