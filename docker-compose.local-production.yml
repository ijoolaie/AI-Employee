services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  api:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LOCAL_PRODUCTION_ALLOW_HTTP: "true"

  worker:
    environment:
      LOCAL_PRODUCTION_ALLOW_HTTP: "true"

  beat:
    environment:
      LOCAL_PRODUCTION_ALLOW_HTTP: "true"

  frontend:
    ports:
      - "127.0.0.1:3000:3000"
